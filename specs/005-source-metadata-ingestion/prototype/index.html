      function saveWizard() {
        const w = wizard;
        if (w.schedule === "daily" && !/^\d\d:\d\d$/.test(w.time))
          return wizardError("请选择每日执行时间。");
        const old = source(w.id);
        const ci = connectionTypes.find((c) => c[0] === w.type);
        const selected = wizardTables().filter(
          (t) => w.scopeMode === "all" || w.selected.includes(t.name),
        );
        const s = {
          id: w.id || "new-" + Date.now(),
          name: w.name.trim(),
          service: w.service,
          type: w.type,
          abbr: ci[1],
          color: ci[2],
          database: w.database,
          host: w.host,
          port: w.port,
          username: w.username,
          password: "********",
          tls: w.tls,
          state: old?.state === "draft" || !old ? "待首次采集" : old.state,
          last: old?.last || "—",
          duration: old?.duration || "—",
          schedule: w.schedule === "manual" ? "手动触发" : "每天 " + w.time,
          active: w.schedule !== "manual",
          scope:
            w.scopeMode === "all" ? "全部表" : selected.length + " 张选中表",
          scopeMode: w.scopeMode,
          selected: [...w.selected],
          viewLineage: w.viewLineage,
          lineage: old && old.state !== "draft" ? old.lineage : "等待首次采集",
          previewTables: old?.previewTables || [],
          pendingTables: selected,
        };
        if (old) {
          Object.assign(old, s);
          old.previewTables = old.previewTables || [];
        } else sources.push(s);
        selectedSource = s.id;
        detailTab = "overview";
        view = "sources";
        closeModal();
        render();
        toast("配置已保存（模拟）。请进入采集任务，查看运行或发起首次采集。");
      }
      function startRun(id, repair = false) {
        const s = source(id);
        selectedSource = id;
        detailTab = "tasks";
        selectedTask = taskName(s);
        runFilter = "";
        view = "sources";
        if (["running", "queued"].includes(s.state)) {
          toast("该数据源已有运行中的采集任务");
          return;
        }
        s.permissionFixed = repair || s.permissionFixed;
        const r = {
          id: "RUN-1103-" + String(runSeq++).padStart(3, "0"),
          source: id,
          state: "queued",
          time:
            "今天 " + new Date().toLocaleTimeString("zh-CN", { hour12: false }),
          trigger: "手动",
          duration: "—",
        };
        runs.unshift(r);
        s.state = "queued";
        closeModal();
        render();
        toast("采集任务已进入 Airflow 队列（模拟）");
        timers.push(
          setTimeout(() => {
            r.state = "running";
            s.state = "running";
            render();
            refreshRunModal(r.id);
          }, 800),
        );
        timers.push(
          setTimeout(() => {
            r.state =
              id === "qms" && !s.permissionFixed ? "partial" : "success";
            s.state = r.state;
            r.duration = "3 秒";
            s.last = "刚刚";
            s.duration = r.duration;
            s.lineage =
              r.state === "partial"
                ? "视图定义读取受限"
                : s.viewLineage === false
                  ? "未启用视图血缘"
                  : "本轮元数据采集完成";
            if (s.pendingTables) {
              s.previewTables = s.pendingTables;
              delete s.pendingTables;
              if (CATALOG[id]) {
                s.catalogOverride = s.previewTables;
              }
            }
            render();
            refreshRunModal(r.id);
            toast(
              r.state === "partial"
                ? "采集部分成功：视图权限仍需处理。"
                : "采集完成（模拟），表与字段元数据已更新。",
            );
          }, 3300),
        );
      }
      function refreshRunModal(id) {
        if (document.getElementById("dialog").open && modalKind === "run:" + id)
          showRun(id);
      }
      function showRun(id) {
        const r = runs.find((r) => r.id === id);
        if (!r) return;
        const s = source(r.source),
          bad = r.state === "partial" || r.state === "failed",
          working = ["queued", "running"].includes(r.state);
        openModal(
          "运行详情",
          `<div class="row between" style="margin-bottom:20px"><div><h3>${esc(s.name)}</h3><p class="mono muted" style="margin-top:6px">${r.id}</p></div>${status(r.state)}</div><div class="row small muted" style="margin-bottom:25px"><span>触发：${r.trigger}</span><span>开始：${r.time}</span><span>耗时：${r.duration}</span></div><div class="run-stage"><span class="stage-dot">${r.state === "queued" ? "…" : "✓"}</span><div><h3>${r.state === "queued" ? "等待 Airflow 调度" : "连接与元数据权限检查"}</h3><p>${r.state === "queued" ? "任务排队中，尚未访问源系统。" : "只读凭证有效，数据库元数据目录可访问。"}</p></div></div><div class="run-stage"><span class="stage-dot">${working ? "…" : "✓"}</span><div><h3>表与字段采集</h3><p>${working ? "等待采集完成。" : `已记录 ${tables(s).length} 张表、${totalColumns(s)} 个字段。`}</p></div></div><div class="run-stage"><span class="stage-dot ${bad ? "amber" : ""}">${working ? "…" : bad ? "!" : "✓"}</span><div><h3>视图与血缘</h3><p>${working ? "等待采集完成。" : bad ? "部分视图定义无法读取，相关血缘未更新。" : "本轮可获取的定义已处理；无来源证据的关系不会自动补全。"}</p></div></div><div class="run-stage"><span class="stage-dot">${working ? "…" : "✓"}</span><div><h3>写入元数据目录</h3><p>${working ? "等待上游采集。" : "表与字段元数据已写入；业务行没有被复制。"}</p></div></div>${bad ? `<div class="alert amber" style="margin-bottom:16px">${icon("warning")}<div><b>处理建议</b><br>请源系统管理员核对视图定义的只读访问权限。保留已采集结果，修复后重试以补全血缘。</div></div><div class="log">[WARN] VIEW_DEFINITION_ACCESS_DENIED\nsource=${esc(s.service)} · schema=public\n表与字段阶段完成；视图血缘阶段部分失败。\n本日志为原型示例，不含凭证与业务行。</div><label class="checkrow" style="margin-top:12px"><input type="checkbox" id="permission-fixed"/>原型演示：模拟视图权限已修复</label>` : `<div class="log">[${working ? "INFO" : "OK"}] metadata_${esc(s.service.replaceAll("-", "_"))}\n${working ? "等待调度 / 采集中……" : "本次仅采集元数据；日志已脱敏。"}</div>`}`,
          `<span class="help">OpenMetadata Ingestion · Airflow</span><div class="row">${btn("关闭", "close")}${bad ? btn("重试采集", "retry", s.id, "primary", "refresh") : ""}</div>`,
          "run:" + id,
        );
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-action]");
        if (!b || b.disabled) return;
        const a = b.dataset.action,
          v = b.dataset.value;
        if (a === "edit-properties") {
          beginProperties(v);
          return;
        }
        if (a === "save-properties") {
          saveProperties();
          return;
        }
        if (a === "catalog-toggle") {
          treeExpanded.has(v) ? treeExpanded.delete(v) : treeExpanded.add(v);
          renderCatalog();
          return;
        }
        if (a === "catalog-pick") {
          selectCatalog(v);
          return;
        }
        if (a === "toggle-catalog") {
          document.body.classList.toggle("catalogue-open");
          render();
          return;
        }
        if (a === "open-tasks" || a === "task-runs") {
          selectedSource = v;
          detailTab = "tasks";
          selectedTask = a === "task-runs" ? taskName(source(v)) : null;
          runFilter = "";
          catalogSelection = null;
          render();
          return;
        }
        if (a === "tasks-back") {
          selectedTask = null;
          runFilter = "";
          render();
          return;
        }
        if (a === "nav") {
          selectedTask = null;
          runFilter = "";
          catalogSelection = null;
          document.body.classList.remove("catalogue-open");
          view = v;
          selectedSource = null;
          closeModal();
          render();
          window.scrollTo(0, 0);
        } else if (a === "outside")
          openModal(
            v,
            `<p class="small muted">当前原型聚焦 Spec 005 源系统元数据采集。${v === "资产搜索" ? "资产搜索与摘要在 Spec 006 中实现。" : "这个工作空间入口不属于本次原型的交互范围。"}</p>`,
            btn("返回数据接入", "close", "", "primary"),
          );
        else if (a === "guide") showGuide();
        else if (a === "close") closeModal();
        else if (a === "clear-filters") {
          sourceQuery = "";
          sourceFilter = "";
          render();
        } else if (a === "detail") {
          selectedTask = null;
          runFilter = "";
          catalogSelection = null;
          selectedSource = v;
          detailTab = "overview";
          selectedTable = "";
          render();
          window.scrollTo(0, 0);
        } else if (a === "back") {
          catalogSelection = null;
          selectedSource = null;
          render();
        } else if (a === "detail-tab") {
          selectedTask = null;
          runFilter = "";
          detailTab = v;
          render();
        } else if (a === "table") {
          catalogSelection = selectedSource + "/table/" + v;
          treeExpanded.add(selectedSource);
          treeExpanded.add(selectedSource + "/db");
          treeExpanded.add(selectedSource + "/schema");
          selectedTable = v;
          render();
        } else if (a === "add") beginWizard();
        else if (a === "configure") beginWizard(v);
        else if (a === "connector") {
          if (
            wizard.id &&
            source(wizard.id)?.state !== "draft" &&
            wizard.type !== v
          ) {
            wizardError("已有采集结果的数据源不能更换连接器，请新建数据源。");
            return;
          }
          if (wizard.type !== v) {
            wizard.type = v;
            wizard.port = String(connectionTypes.find((c) => c[0] === v)[3]);
            wizard.tested = false;
            wizard.selected = [];
          }
          renderWizard();
        } else if (a === "wizard-next") nextWizard();
        else if (a === "wizard-prev") {
          wizard.step--;
          renderWizard();
        } else if (a === "wizard-save") saveWizard();
        else if (a === "test-connection") {
          const err = validateConnection();
          if (err) return wizardError(err);
          wizardError("");
          wizard.tested = !wizard.testFailure;
          document.getElementById("connection-result").innerHTML =
            wizard.testFailure
              ? `<div class="alert red">${icon("warning")}模拟连接失败：无法访问目标地址。请检查网络、端口与连接地址后重试。</div>`
              : `<div class="alert green">${icon("check")}模拟连接成功：网络、身份与目录访问检查通过。</div>`;
        } else if (a === "schedule-confirm") {
          const s = source(v);
          if (s.schedule === "手动触发") {
            toast("此数据源仅手动触发，请在采集配置中设置定时计划。");
            return;
          }
          openModal(
            s.active ? "暂停定时采集？" : "恢复定时采集？",
            `<p class="small muted">${s.active ? "暂停后不会触发新的定时采集，已有元数据和正在运行的任务会保留。仍可手动采集。" : "恢复后按 " + esc(s.schedule) + "（Asia/Shanghai）执行。"}</p>`,
            `${btn("取消", "close")}${btn(s.active ? "确认暂停" : "确认恢复", "schedule-toggle", v, "primary")}`,
          );
        } else if (a === "schedule-toggle") {
          source(v).active = !source(v).active;
          closeModal();
          render();
          toast(
            source(v).active
              ? "定时调度已恢复（模拟）"
              : "定时调度已暂停（模拟）",
          );
        } else if (a === "run") startRun(v);
        else if (a === "retry")
          startRun(
            v,
            document.getElementById("permission-fixed")?.checked || false,
          );
        else if (a === "run-detail") showRun(v);
        else if (a === "refresh-runs") {
          render();
          toast("已刷新本地示例运行状态");
        } else if (a === "dag") {
          const s = source(v);
          openModal(
            "调度任务",
            `<dl class="kv"><dt>DAG 标识</dt><dd class="mono">metadata_${esc(s.service.replaceAll("-", "_"))}</dd><dt>编排器</dt><dd>独立部署的 Airflow</dd><dt>执行器</dt><dd>OpenMetadata Ingestion</dd><dt>调度计划</dt><dd>${esc(s.schedule)} · Asia/Shanghai</dd><dt>当前调度</dt><dd>${s.active ? "启用" : "未启用"}</dd></dl><div class="alert">${icon("clock")}原型展示任务关联关系。实际 DAG 部署、触发与状态回传将在技术方案中验证。</div>`,
            btn("关闭", "close", "", "primary"),
          );
        } else if (a === "reset-confirm")
          openModal(
            "恢复初始示例？",
            `<p class="small muted">清除本次体验中新建的数据源和模拟运行。所有修改只存在于页面内。</p>`,
            `${btn("取消", "close")}${btn("确认恢复", "reset", "", "primary")}`,
          );
        else if (a === "reset") location.reload();
      });
      document.addEventListener("input", (e) => {
        const t = e.target;
        if (
          t.dataset.property &&
          ["name", "description", "retentionPeriod"].includes(
            t.dataset.property,
          )
        )
          propertyDraft[t.dataset.property] = t.value;
        if (t.id === "source-search") {
          sourceQuery = t.value;
          document.getElementById("source-table-wrap").innerHTML =
            sourceTable();
        }
        if (t.dataset.w) {
          wizard[t.dataset.w] = t.type === "checkbox" ? t.checked : t.value;
          if (
            [
              "host",
              "port",
              "database",
              "username",
              "password",
              "tls",
              "testFailure",
            ].includes(t.dataset.w)
          ) {
            wizard.tested = false;
            const result = document.getElementById("connection-result");
            if (result) result.innerHTML = "";
          }
        }
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.dataset.property) {
          const field = t.dataset.property;
          propertyDraft[field] = t.value;
          if (field === "ownerType") propertyDraft.owners = [];
          if (["domain", "ownerType"].includes(field)) {
            const scroll = document.querySelector(".modal-body").scrollTop;
            renderProperties();
            document.querySelector(".modal-body").scrollTop = scroll;
            document
              .querySelector(`[data-property="${field}"]`)
              .focus({ preventScroll: true });
          }
          return;
        }
        if (t.dataset.propertyList) {
          const key = t.dataset.propertyList;
          let values = propertyDraft[key].filter((x) => x !== t.value);
          if (t.checked) {
            if (key === "owners" && propertyDraft.ownerType === "team")
              values = [];
            if (key === "tags")
              values = values.filter(
                (x) => x.split(".")[0] !== t.value.split(".")[0],
              );
            values.push(t.value);
          }
          propertyDraft[key] = values;
          document
            .querySelectorAll(`[data-property-list="${key}"]`)
            .forEach((input) => (input.checked = values.includes(input.value)));
          return;
        }
        if (t.id === "metadata-table-select") {
          selectCatalog(selectedSource + "/table/" + t.value);
          return;
        }
        if (t.id === "source-filter") {
          sourceFilter = t.value;
          render();
        }
        if (t.id === "run-filter") {
          runFilter = t.value;
          render();
        }
        if (t.dataset.w && ["scopeMode", "schedule"].includes(t.dataset.w)) {
          wizard[t.dataset.w] = t.value;
          renderWizard();
        }
        if (t.dataset.tableCheck) {
          wizard.selected = Array.from(
            document.querySelectorAll("[data-table-check]:checked"),
          ).map((x) => x.dataset.tableCheck);
        }
      });
      document.getElementById("dialog").addEventListener("cancel", () => {
        modalKind = "";
      });
      hydrateIcons();
      render();
    </script>
  </body>
</html>
