<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>织境 Contexture — 006 资产搜索与摘要（高保真交互原型）</title>
    <style>
      :root {
        --ctx-primary: #2563eb;
        --ctx-primary-hover: #1d4ed8;
        --ctx-ink: #172338;
        --ctx-muted: #627087;
        --ctx-border: #dfe5ee;
        --ctx-surface: #ffffff;
        --ctx-background: #f4f6fa;
        --ctx-radius: 12px;
        --ctx-font:
          "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui,
          sans-serif;
        --ctx-mono:
          ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        color: var(--ctx-ink);
        font-family: var(--ctx-font);
        background: var(--ctx-background);
        font-size: 14px;
        line-height: 1.55;
      }

      body.resizing {
        cursor: col-resize;
        user-select: none;
      }

      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ctx-primary);
        outline-offset: 2px;
      }

      /* 原型演示状态条（仅用于负责人评审，不进入生产页面） */
      .proto-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 16px;
        background: #172338;
        color: #e2e8f0;
        font-size: 12px;
        border-bottom: 1px solid #2b3b55;
        flex-wrap: wrap;
      }
      .proto-banner-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .proto-tag {
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
      }
      .proto-note {
        color: #94a3b8;
      }
      .proto-Presets {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .proto-btn {
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        border-radius: 6px;
        padding: 3px 9px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.12s;
      }
      .proto-btn:hover {
        background: #334155;
      }
      .proto-btn.active {
        background: #2563eb;
        border-color: #3b82f6;
        color: #fff;
        font-weight: 600;
      }

      /* 生产外壳：与 apps/web/src/styles.css 对齐 */
      .app-shell {
        display: flex;
        height: calc(100dvh - 37px);
        width: 100%;
        overflow: hidden;
      }

      .primary-rail {
        flex: 0 0 76px;
        background: linear-gradient(180deg, #f3f6fe 0%, #e8eefc 100%);
        border-right: 1px solid #dfe6f5;
        color: #5b6b82;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 10px;
        gap: 16px;
      }
      .primary-rail .brand {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
        box-shadow: 0 8px 18px #3b5bdb40;
        color: white;
        text-decoration: none;
      }
      .primary-rail .brand svg {
        width: 28px;
        height: 28px;
        stroke-width: 1.8;
      }
      .rail-divider {
        width: 28px;
        height: 2px;
        border-radius: 1px;
        background: #d5ddef;
      }
      .primary-rail nav {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .primary-link {
        position: relative;
        display: grid;
        place-items: center;
        color: #4b5b74;
        width: 50px;
        height: 50px;
        border-radius: 14px;
        border: 1px solid transparent;
        text-decoration: none;
        cursor: pointer;
        background: transparent;
      }
      .primary-link svg {
        width: 26px;
        height: 26px;
      }
      .primary-link:hover {
        background: #ffffffa8;
        color: var(--ctx-primary);
      }
      .primary-link[aria-current="page"] {
        background: #fff;
        border-color: #cfdcf8;
        color: var(--ctx-primary);
        box-shadow: 0 4px 12px #2f5bd51a;
      }
      .primary-link[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -11px;
        top: 14px;
        bottom: 14px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--ctx-primary);
      }
      .rail-caption {
        margin-top: auto;
        font-size: 13px;
        color: #4b5b74;
        font-weight: 500;
      }

      /* 二级栏：可拖宽 200px - 480px，默认 248px */
      .secondary-rail {
        position: relative;
        flex: 0 0 248px;
        min-width: 200px;
        max-width: 480px;
        background: var(--ctx-surface);
        border-right: 1px solid var(--ctx-border);
        padding: 0 12px 16px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .module-label {
        flex: 0 0 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-weight: 700;
        font-size: 17px;
        color: var(--ctx-ink);
        border-bottom: 1px solid var(--ctx-border);
        margin: 0 -12px 10px;
        padding: 0 18px;
      }
      .module-label-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .module-label svg {
        width: 22px;
        height: 22px;
        color: var(--ctx-primary);
      }
      .rail-resizer {
        position: absolute;
        top: 0;
        right: 0;
        width: 6px;
        height: 100%;
        cursor: col-resize;
        z-index: 5;
      }
      .rail-resizer:hover {
        background: linear-gradient(
          90deg,
          transparent 2px,
          var(--ctx-primary) 2px 4px,
          transparent 4px
        );
      }

      /* 左栏模式说明头 */
      .rail-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 8px 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--ctx-muted);
        letter-spacing: 0.04em;
      }
      .rail-mode-badge {
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 6px;
        background: #eef4ff;
        color: var(--ctx-primary);
        font-weight: 500;
      }

      /* 浏览树 & 类型菜单（与 005 .catalog-row 样式一脉相承，对齐 OM ExploreTree） */
      .catalog-tree,
      .catalog-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .catalog-row {
        display: flex;
        align-items: center;
        min-height: 34px;
        border-radius: 9px;
        margin-bottom: 2px;
      }
      .catalog-row:hover {
        background: #f3f6fb;
      }
      .catalog-row.selected {
        background: #eaf1ff;
      }
      .catalog-toggle {
        display: grid;
        place-items: center;
        width: 22px;
        min-width: 22px;
        height: 28px;
        border: 0;
        padding: 0;
        background: none;
        color: #7a889c;
        cursor: pointer;
      }
      .catalog-toggle svg {
        width: 14px;
        height: 14px;
        transition: transform 0.15s;
      }
      .catalog-toggle svg.open {
        transform: rotate(90deg);
      }
      .catalog-pick {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1 1 0;
        min-width: 0;
        padding: 5px 8px 5px 2px;
        background: none;
        border: 0;
        text-align: left;
        color: #344256;
        font-size: 13.5px;
        cursor: pointer;
        font-family: inherit;
      }
      .catalog-row.selected .catalog-pick {
        color: var(--ctx-primary);
        font-weight: 600;
      }
      .catalog-pick span.node-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .catalog-pick small {
        flex: none;
        margin-left: auto;
        padding: 1px 7px;
        border: 1px solid #dfe5ef;
        border-radius: 7px;
        background: #f7f9fc;
        font-size: 11.5px;
        color: #4b5b74;
        white-space: nowrap;
      }
      .catalog-row.selected .catalog-pick small {
        background: #fff;
        border-color: #bfd3f8;
        color: var(--ctx-primary);
      }
      .connector-badge {
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: #e8efff;
        color: var(--ctx-primary);
        font-weight: 700;
        font-size: 9px;
        flex: none;
      }
      .connector-postgres {
        background: #f0eaff;
        color: #6d3fd1;
      }
      .connector-doris {
        background: #e6f7f4;
        color: #0f766e;
      }
      .connector-gov {
        background: #fef3c7;
        color: #b45309;
      }
      .connector-domain {
        background: #fce7f3;
        color: #be185d;
      }

      /* 主工作区 */
      .workspace {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--ctx-background);
      }

      /* 顶栏：面包屑 + 数据资产搜索框（带范围选择器与输入建议） + 账号 */
      .page-header {
        flex: 0 0 64px;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 0 24px;
        background: var(--ctx-surface);
        border-bottom: 1px solid var(--ctx-border);
        z-index: 20;
      }
      .page-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex-shrink: 0;
      }
      .breadcrumb-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--ctx-muted);
        white-space: nowrap;
      }
      .breadcrumb-bar strong {
        color: var(--ctx-ink);
        font-weight: 600;
        font-size: 16px;
      }
      .breadcrumb-link {
        border: 0;
        background: none;
        padding: 0;
        color: var(--ctx-primary);
        cursor: pointer;
        font: inherit;
        font-weight: 500;
      }
      .breadcrumb-link:hover {
        text-decoration: underline;
      }

      /* OM 风格组合搜索栏：范围下拉 + 关键词输入 + 清除 + 建议浮层 */
      .om-search-container {
        position: relative;
        flex: 1 1 560px;
        max-width: 640px;
        min-width: 240px;
      }
      .om-search-box {
        display: flex;
        align-items: center;
        height: 38px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        background: #f8fafc;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          background 0.15s;
      }
      .om-search-box:focus-within {
        background: #fff;
        border-color: var(--ctx-primary);
        box-shadow: 0 0 0 3px #2563eb1f;
      }
      .om-scope-select {
        height: 100%;
        border: 0;
        border-right: 1px solid #dfe5ee;
        background: transparent;
        padding: 0 10px 0 12px;
        font-size: 13px;
        font-weight: 500;
        color: #334155;
        cursor: pointer;
        border-radius: 9px 0 0 9px;
      }
      .om-search-icon {
        width: 17px;
        height: 17px;
        color: #64748b;
        margin-left: 10px;
        flex-shrink: 0;
      }
      .om-search-input {
        flex: 1;
        border: 0;
        background: transparent;
        padding: 0 10px;
        font-size: 13.5px;
        color: var(--ctx-ink);
        height: 100%;
        min-width: 0;
      }
      .om-search-input:focus {
        outline: none;
      }
      .om-search-clear {
        border: 0;
        background: none;
        color: #64748b;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
      .om-search-kbd {
        margin-right: 8px;
        padding: 2px 6px;
        font-size: 11px;
        border-radius: 5px;
        background: #eef2f6;
        color: #64748b;
        border: 1px solid #dfe5ee;
        white-space: nowrap;
      }

      /* 搜索输入建议浮层（对应 OM Suggestions，按 entityType 分组，每组最多 5 条） */
      .om-suggestions-popover {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: #fff;
        border: 1px solid var(--ctx-border);
        border-radius: 12px;
        box-shadow: 0 14px 36px #0f172a24;
        z-index: 50;
        max-height: 440px;
        overflow-y: auto;
        padding: 8px 0;
      }
      .om-Suggestions-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 14px;
        font-size: 11.5px;
        color: var(--ctx-muted);
        border-bottom: 1px solid #f1f5f9;
      }
      .om-suggestion-group-title {
        padding: 8px 14px 4px;
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .om-suggestion-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 8px 14px;
        border: 0;
        background: none;
        text-align: left;
        cursor: pointer;
        font-family: inherit;
      }
      .om-suggestion-item:hover {
        background: #f1f5f9;
      }
      .om-suggestion-main {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .om-suggestion-fqn {
        font-size: 11.5px;
        color: var(--ctx-muted);
        font-family: var(--ctx-mono);
      }

      /* 顶栏右侧账户 */
      .account-identity {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        flex-shrink: 0;
      }
      .account-avatar {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #e8efff;
        color: #2556b5;
        font-weight: 600;
      }

      /* 探索主视图布局 */
      .explore-wrapper {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 页头与工具栏区 */
      .explore-toolbar-area {
        background: var(--ctx-surface);
        border-bottom: 1px solid var(--ctx-border);
        padding: 14px 24px 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .explore-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .explore-title-left {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .explore-title-left h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .hit-counter {
        font-size: 13px;
        color: var(--ctx-muted);
      }
      .hit-counter strong {
        color: var(--ctx-ink);
      }
      .explore-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ctx-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 34px;
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: 7px;
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        font-family: inherit;
        transition: background 0.12s;
      }
      .ctx-button--primary {
        background: var(--ctx-primary);
        color: #fff;
      }
      .ctx-button--primary:hover {
        background: var(--ctx-primary-hover);
      }
      .ctx-button--secondary {
        border-color: var(--ctx-border);
        background: var(--ctx-surface);
        color: var(--ctx-ink);
      }
      .ctx-button--secondary:hover {
        background: #eaf0fa;
      }
      .ctx-button--ghost {
        background: transparent;
        color: var(--ctx-muted);
      }
      .ctx-button--ghost:hover {
        background: #eaf0fa;
        color: var(--ctx-ink);
      }

      /* 快速筛选栏（ExploreQuickFilters）+ 排序控件 */
      .quick-filters-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .quick-filters-list {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .filter-dropdown-wrap {
        position: relative;
      }
      .filter-pill-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 30px;
        padding: 0 10px;
        border: 1px solid #d5deeb;
        border-radius: 7px;
        background: #fff;
        color: #334155;
        font-size: 12.5px;
        cursor: pointer;
        font-family: inherit;
      }
      .filter-pill-btn:hover {
        border-color: #94a3b8;
        background: #f8fafc;
      }
      .filter-pill-btn.active {
        border-color: var(--ctx-primary);
        background: #eef4ff;
        color: var(--ctx-primary);
        font-weight: 600;
      }
      .filter-pill-count {
        display: inline-grid;
        place-items: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--ctx-primary);
        color: #fff;
        font-size: 11px;
      }

      /* 筛选下拉面板（支持选项内搜索、计数、多选 OR、「无 (未分配)」） */
      .filter-popover {
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        width: 268px;
        background: #fff;
        border: 1px solid var(--ctx-border);
        border-radius: 10px;
        box-shadow: 0 12px 28px #0f172a20;
        z-index: 40;
        padding: 10px;
      }
      .filter-popover-search {
        width: 100%;
        padding: 6px 9px;
        border: 1px solid var(--ctx-border);
        border-radius: 6px;
        font-size: 12.5px;
        margin-bottom: 8px;
      }
      .filter-popover-hint {
        font-size: 11px;
        color: var(--ctx-muted);
        margin-bottom: 6px;
      }
      .filter-options-list {
        max-height: 210px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .filter-option-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12.5px;
      }
      .filter-option-row:hover {
        background: #f1f5f9;
      }
      .filter-option-left {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      .filter-option-count {
        font-size: 11.5px;
        color: var(--ctx-muted);
        background: #f1f5f9;
        padding: 1px 6px;
        border-radius: 6px;
      }

      /* 排序控件 */
      .sort-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--ctx-muted);
      }
      .sort-select {
        height: 30px;
        border: 1px solid #d5deeb;
        border-radius: 7px;
        padding: 0 8px;
        background: #fff;
        color: var(--ctx-ink);
        font-size: 12.5px;
      }
      .sort-order-btn {
        height: 30px;
        width: 30px;
        border: 1px solid #d5deeb;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        color: #334155;
      }

      /* 条件条（ExploreQueryFilterChips） */
      .filter-chips-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding-top: 2px;
        min-height: 26px;
      }
      .active-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 12px;
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        color: #1e293b;
      }
      .active-chip.location-chip {
        background: #eff6ff;
        border-color: #bfdbfe;
        color: #1e40af;
      }
      .active-chip button {
        border: 0;
        background: none;
        padding: 0 2px;
        cursor: pointer;
        color: inherit;
        font-size: 13px;
        line-height: 1;
      }
      .chips-idle-hint {
        font-size: 12px;
        color: var(--ctx-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* 主体双栏：左侧结果卡片列表 + 右侧只读摘要面板 */
      .explore-main-split {
        flex: 1;
        min-height: 0;
        display: flex;
        overflow: hidden;
      }
      .results-column {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 16px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* 结果卡片（对齐 OM ExploreSearchCard） */

        color: var(--ctx-muted);

        margin-bottom: 8px;

        font-weight: 600;

        font-size: 12px;

      }

      /* 空状态、错误状态、骨架屏、子视图容器 */
      .state-panel {
        background: var(--ctx-surface);

        border-radius: 12px;
        padding: 36px 24px;
        text-align: center;
        margin: 8px 0;
      }
      .state-panel.error-state {
        border-color: #f5c2c0;
        background: #fff5f5;
        text-align: left;
      }
      .skeleton-box {
        height: 112px;
        border-radius: 11px;
        background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: pulse 1.4s infinite;
      }
      @keyframes pulse {
        0% {
          background-position: 200% 0;

      .subview-container {

      .mobile-drawer-btn {

  <body>
    <!-- 顶部原型评审状态切换栏（仅用于负责人验收原型状态，不进入生产代码） -->

    <div class="app-shell">

        { key: "serviceType", label: "服务类型", nullAllowed: false },
        { key: "certification", label: "认证状态", nullAllowed: true },
        { key: "database", label: "数据库", nullAllowed: false, tableOnly: true },
        { key: "schema", label: "Schema", nullAllowed: false, tableOnly: true },
        { key: "tableType", label: "表类型", nullAllowed: false, tableOnly: true },
      ];

      // 应用核心状态
      const state = {
        subView: "explore", // explore | sources | detail
        detailAssetId: "tbl-mes-wo",
        mode: "normal", // normal | loading | error | zeroAsset
        search: "",
        scope: "all",
        activeTypeTab: "all",
        browsePath: [], // [{ key, value, label }]
        expandedNodes: new Set(["root-db", "st-mysql", "srv-mes", "db-mes-def", "st-pg", "root-gov"]),
        quickFilters: {}, // { dimKey: Set([val1, val2]) }
        openDropdownKey: null,
        dropdownSearch: "",
        sortField: "popularity",
        sortOrder: "desc",
        pageSize: 15,
        currentPage: 1,
        selectedAssetId: "tbl-mes-wo",
        summaryOpen: true,
        summaryTab: "overview", // overview | schema
      };

      // 工具函数：正则转义与关键词高亮
      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function highlightText(text, keyword) {
        const safe = escapeHtml(text);
        const kw = (keyword || "").trim();
        if (!kw) return safe;
        const escapedKw = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(`(${escapedKw})`, "gi");
        return safe.replace(re, '<span class="text-highlighter">$1</span>');
      }

      function getAssetDimensionValues(asset, dimKey) {
        if (dimKey === "entityType") return [ENTITY_TYPE_LABELS[asset.entityType] || asset.entityType];
        if (dimKey === "domain") return asset.domain ? [asset.domain] : [];
        if (dimKey === "owners") return asset.owners && asset.owners.length ? asset.owners : [];
        if (dimKey === "tier") return asset.tier ? [asset.tier] : [];
        if (dimKey === "tags") {
          const list = [...(asset.tags || [])];
          if (asset.securityLevel) list.push(asset.securityLevel);
          return list;
        }
        if (dimKey === "service") return asset.service ? [asset.service] : [];
        if (dimKey === "serviceType") return asset.serviceType ? [asset.serviceType] : [];
        if (dimKey === "certification") return asset.certification ? [asset.certification] : [];
        if (dimKey === "database") return asset.database ? [asset.database] : [];
        if (dimKey === "schema") return asset.schema ? [asset.schema] : [];
        if (dimKey === "tableType") return asset.tableType ? [asset.tableType] : [];
        return [];
      }

      function matchesKeyword(asset, kw) {
        if (!kw) return true;
        const lower = kw.toLowerCase();
        const haystacks = [
          asset.name,
          asset.displayName,
          asset.fqn,
          asset.description,
          asset.service,
          asset.schema,
          asset.domain,
          ...(asset.owners || []),
          ...(asset.tags || []),
          ...(asset.glossaryTerms || []),
          ...((asset.columns || []).flatMap((c) => [c.name, c.displayName, c.description])),
        ];
        return haystacks.some((h) => h && String(h).toLowerCase().includes(lower));
      }

      function getMatchedFieldSummary(asset, kw) {
        if (!kw) return null;
        const lower = kw.toLowerCase();
        const matchedCols = (asset.columns || []).filter(
          (c) =>
            c.name.toLowerCase().includes(lower) ||
            c.displayName.toLowerCase().includes(lower) ||
            c.description.toLowerCase().includes(lower)
        );
        if (matchedCols.length > 0) {
          return `命中列 (${matchedCols.length}): ${matchedCols.map((c) => c.name).join(", ")}`;
        }
        if (asset.name.toLowerCase().includes(lower) || asset.displayName.toLowerCase().includes(lower)) {
          return "命中资产名称 / 中文名";
        }
        return "命中资产描述 / 标签元数据";
      }

      // 过滤资产（支持 excludeDimKey 以实现 OM ExploreQuickFilters 的排除本维度聚合计数）
      function filterAssets({ excludeDimKey = null, ignoreActiveTypeTab = false } = {}) {
        if (state.mode === "zeroAsset") return [];
        const kw = state.search.trim();
        return MOCK_ASSETS.filter((asset) => {
          // 1. 搜索范围（顶栏 Scope）
          if (state.scope !== "all" && asset.entityType !== state.scope) {
            return false;
          }
          // 2. 关键词检索
          if (kw && !matchesKeyword(asset, kw)) {
            return false;
          }
          // 3. 有关键词时左栏选中的类型 Tab
          if (
            !ignoreActiveTypeTab &&
            kw &&
            state.activeTypeTab !== "all" &&
            asset.entityType !== state.activeTypeTab
          ) {
            return false;
          }
          // 4. 浏览树位置条件（browsePath）
          for (const node of state.browsePath) {
            if (node.key === "group" && node.value === "Databases") {
              if (asset.serviceType === "Governance") return false;
            } else if (node.key === "serviceType" && asset.serviceType !== node.value) {
              return false;
            } else if (node.key === "service" && asset.service !== node.value) {
              return false;
            } else if (node.key === "database" && asset.database !== node.value) {
              return false;
            } else if (node.key === "schema" && asset.schema !== node.value) {
              return false;
            } else if (node.key === "entityType" && asset.entityType !== node.value) {
              return false;
            }
          }
          // 5. 快速筛选（同维度内 OR，跨维度 AND，支持 OM_NULL_FIELD "无 (未分配)"）
          for (const [dimKey, selectedSet] of Object.entries(state.quickFilters)) {
            if (dimKey === excludeDimKey) continue;
            if (!selectedSet || selectedSet.size === 0) continue;
            const values = getAssetDimensionValues(asset, dimKey);
            let matchedThisDim = false;
            if (selectedSet.has("OM_NULL_FIELD") && values.length === 0) {
              matchedThisDim = true;
            }
            for (const v of values) {
              if (selectedSet.has(v)) {
                matchedThisDim = true;
                break;
              }
            }
            if (!matchedThisDim) return false;
          }
          return true;
        });
      }

      function sortAssets(list) {
        const dir = state.sortOrder === "asc" ? 1 : -1;
        return [...list].sort((a, b) => {
          if (state.sortField === "name") {
            return a.name.localeCompare(b.name) * dir;
          }
          if (state.sortField === "updatedAt") {
            return a.updatedAt.localeCompare(b.updatedAt) * dir;
          }
          // popularity or relevance
          return (a.popularity - b.popularity) * dir;
        });
      }

      // 006 不实现地址状态（负责人 2026-11-09 决定）：搜索条件只在本次会话内保留，刷新回到初始浏览状态

      // 渲染顶栏面包屑
      function renderBreadcrumb() {
        const el = document.getElementById("topBreadcrumb");
        const parts = [];
        parts.push(
          `<button type="button" class="breadcrumb-link" onclick="returnToExplore()">数据资产</button>`
        );
        if (state.subView === "sources") {
          parts.push(`<span>/</span><strong>数据源管理 (005 子视图)</strong>`);
        } else if (state.subView === "detail") {
          const asset = MOCK_ASSETS.find((a) => a.id === state.detailAssetId) || MOCK_ASSETS[0];
          parts.push(`<span>/</span><span>${escapeHtml(asset.service)}</span>`);
          parts.push(`<span>/</span><strong>${escapeHtml(asset.displayName)}</strong>`);
        } else if (state.browsePath.length > 0) {
          for (const node of state.browsePath) {
            parts.push(`<span>/</span><span>${escapeHtml(node.value)}</span>`);
          }
        } else if (state.search.trim()) {
          parts.push(`<span>/</span><strong>搜索结果</strong>`);
        } else {
          parts.push(`<span>/</span><strong>探索全部</strong>`);
        }
        el.innerHTML = parts.join(" ");
      }

      // 渲染左侧二级栏：无关键词时为浏览树（ExploreTree），有关键词时为命中资产类型计数菜单（entityTypeCounts）
      function renderLeftSidebar() {
        const titleEl = document.getElementById("leftPanelTitle");
        const badgeEl = document.getElementById("leftPanelBadge");
        const container = document.getElementById("leftSidebarContent");
        const kw = state.search.trim();

        if (kw) {
          titleEl.textContent = "命中资产类型 (entityTypeCounts)";
          badgeEl.textContent = "关键词聚合";
          const allHits = filterAssets({ ignoreActiveTypeTab: true });
          const counts = {};
          for (const a of allHits) {
            counts[a.entityType] = (counts[a.entityType] || 0) + 1;
          }
          const items = [
            { type: "all", label: "全部命中类型", count: allHits.length, badge: "ALL" },
            { type: "table", label: "表 (Table)", count: counts.table || 0, badge: "TB" },
            { type: "tableColumn", label: "列/字段 (Column)", count: counts.tableColumn || 0, badge: "CL" },
            { type: "databaseSchema", label: "Schema", count: counts.databaseSchema || 0, badge: "SC" },
            { type: "glossaryTerm", label: "业务术语 (Glossary)", count: counts.glossaryTerm || 0, badge: "TM" },
            { type: "tag", label: "分类标签 (Tag)", count: counts.tag || 0, badge: "TG" },
          ].filter((it) => it.type === "all" || it.count > 0);

          container.innerHTML = `
            <ul class="catalog-list">
              ${items
                .map(
                  (it) => `
                <li class="catalog-row ${state.activeTypeTab === it.type ? "selected" : ""}">
                  <button type="button" class="catalog-pick" onclick="selectTypeTab('${it.type}')">
                    <span class="connector-badge">${it.badge}</span>
                    <span class="node-label">${escapeHtml(it.label)}</span>
                    <small>${it.count}</small>
                  </button>
                </li>
              `
                )
                .join("")}
            </ul>
            <p style="margin: 12px 8px 0; font-size: 11.5px; color: var(--ctx-muted);">
              提示：对齐 OM Explore，有搜索关键词时左栏切换为命中计数大于 0 的资产类型列表；清空搜索词后恢复层级浏览树。
            </p>
          `;
          return;
        }

        // 无关键词：渲染 OM ExploreTree 风格浏览树
        titleEl.textContent = "资产目录 (ExploreTree)";
        badgeEl.textContent = "点节点设位置条件";

        if (state.mode === "zeroAsset") {
          container.innerHTML = `
            <div style="padding: 16px 8px; font-size: 12.5px; color: var(--ctx-muted);">
              暂无已采集或导入的资产目录（计数为 0 的根节点自动隐藏）。
            </div>
          `;
          return;
        }

        const currentPathSig = state.browsePath.map((p) => `${p.key}:${p.value}`).join("/");

        function renderNodes(nodes, depth = 0) {
          return `
            <ul class="catalog-tree">
              ${nodes
                .map((node) => {
                  const hasChildren = node.children && node.children.length > 0;
                  const isOpen = state.expandedNodes.has(node.id);
                  const nodeSig = node.path.map((p) => `${p.key}:${p.value}`).join("/");
                  const isSelected = currentPathSig === nodeSig && state.subView === "explore";
                  const indent = depth * 12;
                  return `
                    <li>
                      <div class="catalog-row ${isSelected ? "selected" : ""}" style="padding-left: ${indent}px">
                        ${
                          hasChildren
                            ? `<button type="button" class="catalog-toggle" onclick="toggleTreeNode('${node.id}', event)" aria-label="展开或收起">
                                 <svg class="${isOpen ? "open" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
                               </button>`
                            : `<span style="width: 22px; display: inline-block"></span>`
                        }
                        <button type="button" class="catalog-pick" onclick="applyBrowseNode('${node.id}')">
                          ${
                            node.badge
                              ? `<span class="connector-badge ${node.badgeClass || ""}">${node.badge}</span>`
                              : ""
                          }
                          <span class="node-label" title="${escapeHtml(node.label)}">${escapeHtml(node.label)}</span>
                          <small>${node.count}</small>
                        </button>
                      </div>
                      ${hasChildren && isOpen ? renderNodes(node.children, depth + 1) : ""}
                    </li>
                  `;
                })
                .join("")}
            </ul>
          `;
        }

        container.innerHTML = renderNodes(BROWSE_TREE_DATA, 0);
      }

      // 渲染快速筛选栏（ExploreQuickFilters）
      function renderQuickFilters() {
        const bar = document.getElementById("quickFiltersBar");
        const isTableContext =
          state.scope === "table" ||
          state.activeTypeTab === "table" ||
          (state.quickFilters.entityType && state.quickFilters.entityType.has("表 (Table)"));

        const dims = QUICK_FILTER_DIMENSIONS.filter((d) => !d.tableOnly || isTableContext);

        bar.innerHTML = dims
          .map((dim) => {
            const selectedSet = state.quickFilters[dim.key] || new Set();
            const count = selectedSet.size;
            const isOpen = state.openDropdownKey === dim.key;

            // 计算该维度的聚合选项计数（排除本维度自身条件，对齐 OM ExploreQuickFilters）
            const baseAssets = filterAssets({ excludeDimKey: dim.key });
            const bucketCounts = new Map();
            let nullCount = 0;
            for (const a of baseAssets) {
              const vals = getAssetDimensionValues(a, dim.key);
              if (vals.length === 0) {
                nullCount++;
              } else {
                for (const v of vals) {
                  bucketCounts.set(v, (bucketCounts.get(v) || 0) + 1);
                }
              }
            }

            const options = [];
            if (dim.nullAllowed) {
              options.push({
                value: "OM_NULL_FIELD",
                label: "无 (未分配 / 缺失该属性)",
                count: nullCount,
              });
            }
            for (const [val, cnt] of bucketCounts.entries()) {
              options.push({ value: val, label: val, count: cnt });
            }

            const q = state.dropdownSearch.trim().toLowerCase();
            const filteredOptions = q
              ? options.filter((o) => o.label.toLowerCase().includes(q))
              : options;

            return `
              <div class="filter-dropdown-wrap">
                <button
                  type="button"
                  class="filter-pill-btn ${count > 0 ? "active" : ""}"
                  onclick="toggleFilterDropdown('${dim.key}', event)"
                >
                  <span>${escapeHtml(dim.label)}</span>
                  ${count > 0 ? `<span class="filter-pill-count">${count}</span>` : ""}
                  <span style="font-size: 10px; opacity: 0.7">▾</span>
                </button>
                ${
                  isOpen
                    ? `
                  <div class="filter-popover" onclick="event.stopPropagation()">
                    <input
                      type="search"
                      class="filter-popover-search"
                      placeholder="搜索${escapeHtml(dim.label)}选项..."
                      value="${escapeHtml(state.dropdownSearch)}"
                      oninput="onDropdownSearchInput(this.value)"
                    />
                    <div class="filter-popover-hint">
                      同维度多选为 OR，跨维度为 AND（计数已排除本维度自身条件）
                    </div>
                    <div class="filter-options-list">
                      ${
                        filteredOptions.length === 0
                          ? `<div style="padding: 8px; font-size: 12px; color: var(--ctx-muted);">无匹配筛选项</div>`
                          : filteredOptions
                              .map((opt) => {
                                const checked = selectedSet.has(opt.value);
                                return `
                                  <label class="filter-option-row">
                                    <span class="filter-option-left">
                                      <input
                                        type="checkbox"
                                        ${checked ? "checked" : ""}
                                        onchange="toggleFilterValue('${dim.key}', '${escapeHtml(opt.value)}')"
                                      />
                                      <span>${escapeHtml(opt.label)}</span>
                                    </span>
                                    <span class="filter-option-count">${opt.count}</span>
                                  </label>
                                `;
                              })
                              .join("")
                      }
                    </div>
                  </div>
                `
                    : ""
                }
              </div>
            `;
          })
          .join("");
      }

      // 渲染条件条（ExploreQueryFilterChips）
      function renderFilterChips() {
        const bar = document.getElementById("filterChipsBar");
        const chips = [];

        // 1. 位置条件（删除父级时连同子级一起删）
        state.browsePath.forEach((node, idx) => {
          chips.push(`
            <span class="active-chip location-chip" title="点击删除该层及下级位置条件">
              <span>${escapeHtml(node.label)}</span>
              <button type="button" onclick="removeBrowseChipAt(${idx})" aria-label="移除位置条件">×</button>
            </span>
          `);
        });

        // 2. 快速筛选条件
        for (const dim of QUICK_FILTER_DIMENSIONS) {
          const set = state.quickFilters[dim.key];
          if (!set || set.size === 0) continue;
          for (const val of set) {
            const displayVal = val === "OM_NULL_FIELD" ? "无 (未分配)" : val;
            chips.push(`
              <span class="active-chip">
                <span>${escapeHtml(dim.label)}: <strong>${escapeHtml(displayVal)}</strong></span>
                <button type="button" onclick="toggleFilterValue('${dim.key}', '${escapeHtml(val)}')" aria-label="移除筛选条件">×</button>
              </span>
            `);
          }
        }

        if (chips.length > 0 || state.search.trim()) {
          bar.innerHTML = `
            ${chips.join("")}
            <button type="button" class="ctx-button ctx-button--ghost" style="min-height: 24px; padding: 2px 8px; font-size: 12px;" onclick="clearAllFilters()">
              清除全部
            </button>
          `;
        } else {
          bar.innerHTML = `
            <div class="chips-idle-hint">
              <span>提示：点击左侧浏览树节点可按层级筛选位置（不跳转页面），也可使用上方搜索框或快速筛选组合过滤资产。</span>
            </div>
          `;
        }
      }

      // 渲染结果卡片与右侧只读摘要面板
      function renderResultsAndSummary() {
        const resultsCol = document.getElementById("resultsColumn");
        const summaryDrawer = document.getElementById("summaryDrawer");
        const headingEl = document.getElementById("exploreHeading");
        const counterEl = document.getElementById("hitCounterText");

        if (state.mode === "loading") {
          headingEl.textContent = "正在检索数据资产...";
          counterEl.textContent = "调用 /bff/v1/assets/search → OM /v1/search/query";
          resultsCol.innerHTML = `
            <div class="skeleton-box"></div>
            <div class="skeleton-box"></div>
            <div class="skeleton-box"></div>
          `;
          summaryDrawer.classList.add("hidden");
          return;
        }

        if (state.mode === "error") {
          headingEl.textContent = "资产检索服务不可用";
          counterEl.textContent = "";
          resultsCol.innerHTML = `
            <div class="state-panel error-state" role="alert">
              <h3 style="margin: 0 0 8px; color: #991b1b;">OpenMetadata 搜索后端或 OpenSearch 索引异常</h3>
              <p style="margin: 0 0 10px; font-size: 13.5px; color: #7f1d1d;">
                请求 <code>GET /bff/v1/assets/search</code> 返回真实错误（严禁回退内置示例数据或伪造空结果）：
              </p>
              <pre style="background: #fff; border: 1px solid #fecaca; padding: 10px 12px; border-radius: 8px; font-size: 12px; overflow-x: auto;">HTTP 503 Service Unavailable
错误码: OM_SEARCH_INDEX_UNAVAILABLE
详情: OpenSearch cluster [opensearch:9200] index [table_search_index] status is RED or unreachable.
排查建议: 请检查 OpenSearch 容器内存与索引状态，或在 OpenMetadata 执行 Search Indexing 管线重建。</pre>
              <div style="margin-top: 12px; display: flex; gap: 8px;">
                <button type="button" class="ctx-button ctx-button--primary" onclick="applyPreset('default')">重试检索</button>
                <button type="button" class="ctx-button ctx-button--secondary" onclick="openSubView('sources')">查看数据源与采集管线</button>
              </div>
            </div>
          `;
          summaryDrawer.classList.add("hidden");
          return;
        }

        if (state.mode === "zeroAsset") {
          headingEl.textContent = "尚未接入任何数据资产";
          counterEl.textContent = "共 0 条资产";
          resultsCol.innerHTML = `
            <div class="state-panel">
              <h3 style="margin: 0 0 8px;">当前平台还没有任何数据资产元数据</h3>
              <p style="margin: 0 auto 16px; max-width: 520px; color: var(--ctx-muted);">
                您可以前往「数据源管理」接入 MySQL / PostgreSQL / Doris 等业务源库并触发元数据采集（005），或在开发环境下运行 006 开发态元数据导入工具导入 003 表结构定义。
              </p>
              <div style="display: flex; justify-content: center; gap: 10px;">
                <button type="button" class="ctx-button ctx-button--primary" onclick="openSubView('sources')">+ 添加数据源并采集</button>
              </div>
            </div>
          `;
          summaryDrawer.classList.add("hidden");
          return;
        }

        const filtered = sortAssets(filterAssets());
        const kw = state.search.trim();

        if (kw) {
          headingEl.textContent = `“${kw}” 的搜索结果`;
        } else if (state.browsePath.length > 0) {
          headingEl.textContent = state.browsePath[state.browsePath.length - 1].label;
        } else {
          headingEl.textContent = "全部数据资产";
        }
        counterEl.innerHTML = `共找到 <strong>${filtered.length}</strong> 项资产`;

        if (filtered.length === 0) {
          resultsCol.innerHTML = `
            <div class="state-panel">
              <h3 style="margin: 0 0 8px;">未找到匹配当前条件的数据资产</h3>
              <p style="margin: 0 auto 14px; max-width: 460px; color: var(--ctx-muted);">
                请尝试调整搜索关键词、减少快速筛选条件，或点击下方按钮清空全部筛选条件。
              </p>
              <button type="button" class="ctx-button ctx-button--secondary" onclick="clearAllFilters()">清除全部搜索与筛选条件</button>
            </div>
          `;
          summaryDrawer.classList.add("hidden");
          return;
        }

        // 结果更新后自动选中第一条（对齐 OM EntitySummaryPanel 行为）
        if (!filtered.some((a) => a.id === state.selectedAssetId)) {
          state.selectedAssetId = filtered[0].id;
        }

        const cardsHtml = filtered
          .map((asset) => {
            const isSelected = asset.id === state.selectedAssetId && state.summaryOpen;
            const matchSummary = getMatchedFieldSummary(asset, kw);
            const secClass =
              asset.securityLevel === "数据级别.三级"
                ? "badge-sec-l3"
                : asset.securityLevel === "数据级别.二级"
                  ? "badge-sec-l2"
                  : "badge-sec-l1";

            return `
              <article

                        (c) => `<tr id="col-row-${escapeHtml(c.name)}" style="${c.name === hl ? "background:#fef9c3; outline:2px solid #facc15;" : ""}">
                      <td style="padding:8px 10px; border-bottom:1px solid var(--ctx-border); font-family:var(--ctx-mono);">${escapeHtml(c.name)}${c.constraint === "PK" ? ' <span class="badge badge-tier" style="padding:0 5px; font-size:10px;">PK</span>' : ""}</td>
                      <td style="padding:8px 10px; border-bottom:1px solid var(--ctx-border);">${escapeHtml(c.dataType)}</td>
                      <td style="padding:8px 10px; border-bottom:1px solid var(--ctx-border);">${escapeHtml(c.displayName)}<div style="color:var(--ctx-muted); font-size:12px;">${escapeHtml(c.description)}</div></td>
                      <td style="padding:8px 10px; border-bottom:1px solid var(--ctx-border);">${escapeHtml(c.securityLevel || "—")}</td>
                    </tr>`
                      )
                      .join("")}
                  </tbody>
                </table>`
                    : ""
                }
              </div>
            `;
            if (hl) {
              const row = document.getElementById(`col-row-${hl}`);
              if (row) setTimeout(() => row.scrollIntoView({ block: "center" }), 0);
            }
          }
        }
      }

      // 统一重绘入口
      function renderAll() {
        document.getElementById("searchClearBtn").hidden = !state.search;
        document.getElementById("searchScopeSelect").value = state.scope;
        document.getElementById("sortFieldSelect").value = state.sortField;
        document.getElementById("sortOrderBtn").textContent =
          state.sortOrder === "asc" ? "↑" : "↓";

        renderBreadcrumb();
        renderLeftSidebar();
        renderSubViews();
        if (state.subView === "explore") {
          renderQuickFilters();
          renderFilterChips();
          renderResultsAndSummary();
        }
      }

      // 交互事件处理函数
      function toggleTreeNode(nodeId, ev) {
        ev.stopPropagation();
        if (state.expandedNodes.has(nodeId)) {
          state.expandedNodes.delete(nodeId);
        } else {
          state.expandedNodes.add(nodeId);
        }
        renderLeftSidebar();
      }

      function findTreeNodeById(nodes, id) {
        for (const n of nodes) {
          if (n.id === id) return n;
          if (n.children) {
            const found = findTreeNodeById(n.children, id);
            if (found) return found;
          }
        }
        return null;
      }

      // 点击浏览树节点：只设置位置条件（browsePath），不跳出探索视图；若在子视图则带着位置条件回到探索视图
      function applyBrowseNode(nodeId) {
        const node = findTreeNodeById(BROWSE_TREE_DATA, nodeId);
        if (!node) return;
        state.subView = "explore";
        state.mode = "normal";
        state.browsePath = [...node.path];
        state.summaryOpen = true;
        renderAll();
      }

      function removeBrowseChipAt(index) {
        state.browsePath = state.browsePath.slice(0, index);
        renderAll();
      }

      function selectTypeTab(type) {
        state.activeTypeTab = type;
        state.subView = "explore";
        renderAll();
      }

      function toggleFilterDropdown(dimKey, ev) {
        ev.stopPropagation();
        if (state.openDropdownKey === dimKey) {
          state.openDropdownKey = null;
        } else {
          state.openDropdownKey = dimKey;
          state.dropdownSearch = "";
        }
        renderQuickFilters();
      }

      function onDropdownSearchInput(val) {
        state.dropdownSearch = val;
        renderQuickFilters();
      }

      function toggleFilterValue(dimKey, val) {
        if (!state.quickFilters[dimKey]) {
          state.quickFilters[dimKey] = new Set();
        }
        const set = state.quickFilters[dimKey];
        if (set.has(val)) {
          set.delete(val);
        } else {
          set.add(val);
        }
        state.mode = "normal";
        renderAll();
      }

      function clearAllFilters() {
        state.mode = "normal";
        state.search = "";
        state.scope = "all";
        state.activeTypeTab = "all";
        state.browsePath = [];
        state.quickFilters = {};
        state.openDropdownKey = null;
        document.getElementById("searchInput").value = "";
        document.getElementById("suggestionsPopover").hidden = true;
        renderAll();
      }

      function selectAssetCard(assetId) {
        state.selectedAssetId = assetId;
        state.summaryOpen = true;
        renderResultsAndSummary();
      }

      function closeSummaryDrawer() {
        state.summaryOpen = false;
        renderResultsAndSummary();
      }

      function switchSummaryTab(tab) {
        state.summaryTab = tab;
        renderResultsAndSummary();
      }

      function openAssetDetail(assetId, ev) {
        if (ev) ev.stopPropagation();
        const target = MOCK_ASSETS.find((a) => a.id === assetId);
        state.highlightColumn = null;
        if (target && target.entityType === "tableColumn") {
          // 列结果：跳到所属表的详情，并定位到该列（负责人 2026-11-09 决定）
          const parentFqn = target.fqn.split(".").slice(0, -1).join(".");
          const parent = MOCK_ASSETS.find((a) => a.fqn === parentFqn);
          if (parent) {
            assetId = parent.id;
            state.highlightColumn = target.name;
          }
        }
        state.detailAssetId = assetId;
        state.subView = "detail";
        document.getElementById("suggestionsPopover").hidden = true;
        renderAll();
      }

      function openSubView(viewName) {
        state.subView = viewName;
        renderAll();
      }

      function returnToExplore() {
        state.subView = "explore";
        renderAll();
      }

      function changePageSize(val) {
        state.pageSize = Number(val) || 15;
        state.currentPage = 1;
        renderAll();
      }

      // 原型预设状态一键切换（覆盖 page-structure.md 第 2.4 节全部 9 种状态 + 同名表辨识 + 子视图）
      function applyPreset(presetName) {
        document.querySelectorAll("#presetBar .proto-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.preset === presetName);
        });

        state.subView = "explore";
        state.mode = "normal";
        state.search = "";
        state.scope = "all";
        state.activeTypeTab = "all";
        state.browsePath = [];
        state.quickFilters = {};
        state.openDropdownKey = null;
        state.summaryOpen = true;
        state.summaryTab = "overview";

        if (presetName === "keyword") {
          state.search = "质检";
          state.sortField = "relevance";
          state.selectedAssetId = "tbl-qms-insp";
        } else if (presetName === "homonym") {
          state.search = "material";
          state.sortField = "relevance";
          state.selectedAssetId = "tbl-mes-mat";
        } else if (presetName === "nullFilter") {
          state.quickFilters = {
            owners: new Set(["OM_NULL_FIELD"]),
            tier: new Set(["OM_NULL_FIELD"]),
          };
          state.selectedAssetId = "tbl-mes-equip-staging";
        } else if (presetName === "emptyHit") {
          state.search = "不存在的ERP财务总账表_xyz";
        } else if (presetName === "loading") {
          state.mode = "loading";
        } else if (presetName === "error") {
          state.mode = "error";
        } else if (presetName === "zeroAsset") {
          state.mode = "zeroAsset";
        } else if (presetName === "sourcesView") {
          state.subView = "sources";
        } else if (presetName === "detailView") {
          state.subView = "detail";
          state.detailAssetId = "tbl-mes-wo";
          state.highlightColumn = null;
        } else if (presetName === "termDetail") {
          state.search = "不良率";
          openAssetDetail("term-defect-rate");
        } else if (presetName === "columnJump") {
          state.search = "order_no";
          openAssetDetail("col-order-no");
        }

        document.getElementById("searchInput").value = state.search;
        document.getElementById("suggestionsPopover").hidden = true;
        renderAll();
      }

      // 绑定 DOM 事件
      document.getElementById("presetBar").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-preset]");
        if (btn) applyPreset(btn.dataset.preset);
      });

      const searchInputEl = document.getElementById("searchInput");
      let suggestTimer = null;
      searchInputEl.addEventListener("input", (e) => {
        state.search = e.target.value;
        state.mode = "normal";
        state.subView = "explore";
        if (state.search.trim()) {
          // 有关键词时默认选首条命中结果的类型，否则选计数最多的类型（对齐 OM Explore）
          const hits = filterAssets({ ignoreActiveTypeTab: true });
          state.activeTypeTab = hits.length > 0 ? "all" : "all";
        }
        clearTimeout(suggestTimer);
        suggestTimer = setTimeout(() => {
          renderSuggestionsPopover();
          renderAll();
        }, 120);
      });

      searchInputEl.addEventListener("focus", () => {
        if (state.search.trim()) renderSuggestionsPopover();
      });

      document.getElementById("searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        state.subView = "explore";
        state.mode = "normal";
        if (state.search.trim()) {
          state.sortField = "relevance";
        }
        document.getElementById("suggestionsPopover").hidden = true;
        renderAll();
      });

      document.getElementById("searchClearBtn").addEventListener("click", () => {
        state.search = "";
        state.activeTypeTab = "all";
        searchInputEl.value = "";
        document.getElementById("suggestionsPopover").hidden = true;
        renderAll();
      });

      document.getElementById("searchScopeSelect").addEventListener("change", (e) => {
        state.scope = e.target.value;
        state.subView = "explore";
        renderAll();
      });

      document.getElementById("sortFieldSelect").addEventListener("change", (e) => {
        state.sortField = e.target.value;
        state.currentPage = 1;
        renderAll();
      });

      document.getElementById("sortOrderBtn").addEventListener("click", () => {
        state.sortOrder = state.sortOrder === "desc" ? "asc" : "desc";
        state.currentPage = 1;
        renderAll();
      });

      document.getElementById("openSourcesBtn").addEventListener("click", () => {
        openSubView("sources");
      });
      document.getElementById("addSourceBtn").addEventListener("click", () => {
        openSubView("sources");
      });
      document.getElementById("navAssetsBtn").addEventListener("click", () => {
        returnToExplore();
      });

      // 点击页面空白关闭下拉与输入建议
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".filter-dropdown-wrap") && state.openDropdownKey) {
          state.openDropdownKey = null;
          renderQuickFilters();
        }
        if (!e.target.closest("#searchContainer")) {
          document.getElementById("suggestionsPopover").hidden = true;
        }
      });

      // 按 Esc 关闭右侧摘要面板或下拉浮层
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          document.getElementById("suggestionsPopover").hidden = true;
          if (state.openDropdownKey) {
            state.openDropdownKey = null;
            renderQuickFilters();
          } else if (state.summaryOpen) {
            closeSummaryDrawer();
          }
        }
      });

      // 二级导航栏右边缘拖拽调宽（200px - 480px，对齐 005 AppShell）
      const railResizer = document.getElementById("railResizer");
      const secondaryRail = document.getElementById("secondaryRail");
      railResizer.addEventListener("mousedown", (e) => {
        e.preventDefault();
        document.body.classList.add("resizing");
        const startX = e.clientX;
        const startW = secondaryRail.getBoundingClientRect().width;
        function onMove(ev) {
          const nextW = Math.min(480, Math.max(200, startW + (ev.clientX - startX)));
          secondaryRail.style.flexBasis = `${nextW}px`;
        }
        function onUp() {
          document.body.classList.remove("resizing");
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
        }
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      });

      // 窄屏「目录」抽屉按钮
      document.getElementById("mobileDrawerBtn").addEventListener("click", () => {
        secondaryRail.classList.toggle("mobile-open");
      });

      renderAll();
    </script>
  </body>
</html>
