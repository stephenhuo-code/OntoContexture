<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>织境 Web · 可交互原型（原型）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF1F5}
a{color:#1D4ED8;text-decoration:none}a:hover{color:#1E3A8A}
</style>
<style>
.ctx-prototype-badge{position:fixed;right:12px;bottom:12px;z-index:100;background:#B45309;color:#FFFFFF;font:600 12px/1.4 system-ui,sans-serif;padding:6px 10px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<!-- 004 织境 Web HTML 高保真原型（宪法 v2.0.0“界面设计先行”）。最初由 Design 画布转换，后续在此维护交互。
     原型代码不得作为实现代码复用；界面与交互需求以 spec.md 的文字为准。Agent 的回答为按关键词预设。 -->
<div id="app"></div>
<div class="ctx-prototype-badge">原型 · 非实现代码 · Agent 回答为预设</div>
<template id="tpl">
<div style="min-height: 900px; display: flex; flex-wrap: wrap; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #0F172A; background: #EEF1F5; position: relative;">

  <nav aria-label="一级导航" style="{{railStyle}}">
    <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 14px; height: 40px;">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #2F5BEA; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;">织</div>
    </div>
    <template data-sc="for" list="{{rail}}" as="r" hint-placeholder-count="6">
      <button type="button" aria-label="{{r.label}}" onClick="{{r.go}}" onMouseEnter="{{r.enter}}" onMouseLeave="{{r.leave}}" onFocus="{{r.enter}}" onBlur="{{r.leave}}" style="{{r.style}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{r.d}}"/></svg>
        <template data-sc="if" value="{{r.hover}}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 58px; top: 50%; transform: translateY(-50%); background: #0F172A; color: #FFFFFF; font-size: 13px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3); z-index: 20; pointer-events: none;">{{r.label}}</span></template>
      </button>
    </template>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; justify-content: center; margin-top: 8px;">
      <div title="engineer1 · AI 工程师" style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #334155; color: #E2E8F0; font-size: 13px; display: flex; align-items: center; justify-content: center;">工</div>
    </div>
  </nav>

  <template data-sc="if" value="{{showSecondary}}" hint-placeholder-val="{{ true }}">
    <aside aria-label="二级菜单" style="width: 232px; background: #FFFFFF; border-right: 1px solid #E2E8F0; padding: 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; padding: 0 4px 10px 10px;">
        <span style="font-size: 13px; font-weight: 600; color: #334155; flex-grow: 1;">{{moduleName}}</span>
        <button type="button" onClick="{{toggleSecondary}}" aria-label="收起二级菜单" title="收起二级菜单" style="width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: #475569; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM9 5v14M15 10l-2 2 2 2"/></svg>
        </button>
      </div>
      <template data-sc="for" list="{{menu}}" as="m" hint-placeholder-count="3">
        <template data-sc="if" value="{{m.isHeading}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 12px; color: #64748B; padding: 12px 10px 6px;">{{m.label}}</div>
        </template>
        <template data-sc="if" value="{{m.isItem}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{m.go}}" style="{{m.style}}"><span style="display: flex; align-items: center; gap: 8px; min-width: 0;"><span aria-hidden="true" style="{{m.indentStyle}}"></span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{m.label}}</span></span><template data-sc="if" value="{{m.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="{{m.badgeStyle}}">{{m.badge}}</span></template></button>
        </template>
      </template>
    </aside>
  </template>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <header style="min-height: 60px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 14px; padding: 10px 24px; box-sizing: border-box; flex-wrap: wrap;">
      <template data-sc="if" value="{{showSecondaryOpener}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{toggleSecondary}}" aria-label="展开二级菜单" title="展开二级菜单" style="width: 32px; height: 32px; border: 1px solid #E2E8F0; border-radius: 8px; background: #FFFFFF; color: #475569; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM9 5v14M13 10l2 2-2 2"/></svg>
        </button>
      </template>
      <div style="font-size: 16px; font-weight: 600;">{{pageTitle}}</div>
      <div style="font-size: 13px; color: #475569;">{{pageSub}}</div>
      <div style="flex-grow: 1"></div>
      <label style="display: flex; align-items: center; gap: 8px; background: #F1F5F9; border-radius: 8px; padding: 0 12px; height: 36px; width: 280px; max-width: 100%; color: #64748B; font-size: 13px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        <input type="search" value="{{searchInput}}" onChange="{{onSearchInput}}" onKeyDown="{{onSearchKey}}" placeholder="搜索表、字段、术语…（回车搜索）" aria-label="全局搜索" style="border: 0; background: transparent; outline: none; font: inherit; color: #0F172A; flex-grow: 1; min-width: 0;">
      </label>
      <template data-sc="if" value="{{showAskButton}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{toggleSidebar}}" aria-expanded="{{sidebarAttr}}" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: #0B1220; color: #FFFFFF; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>{{askLabel}}</button>
      </template>
      <template data-sc="if" value="{{isWorkbench}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 12px; color: #475569; display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>以 engineer1 的身份 · 经 AI 网关</span>
      </template>
    </header>

    <div style="display: flex; flex-wrap: wrap; flex-grow: 1; align-items: stretch; min-height: 0;">
      <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column;">

        <template data-sc="if" value="{{isHome}}" hint-placeholder-val="{{ true }}">
          <div style="padding: 26px 28px; display: flex; flex-direction: column; gap: 20px; max-width: 1160px; width: 100%; box-sizing: border-box;">
            <div>
              <h1 style="margin: 0 0 6px; font-size: 22px;">早上好，engineer1</h1>
              <div style="font-size: 14px; color: #475569;">模拟工厂 · 数据截至 2026-09-30</div>
            </div>
            <section aria-label="三域覆盖" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
              <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px;"><div style="font-size: 13px; color: #475569;">系统域 · 已接入源系统</div><div style="font-size: 30px; font-weight: 700; margin: 8px 0 4px;">3</div><div style="font-size: 12px; color: #475569;">MES、QMS、数仓 · 28 张表</div></div>
              <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px;"><div style="font-size: 13px; color: #475569;">工作域 · 飞书</div><div style="font-size: 30px; font-weight: 700; margin: 8px 0 4px; color: #94A3B8;">未接入</div><div style="font-size: 12px; color: #475569;">随 014 接入</div></div>
              <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px;"><div style="font-size: 13px; color: #475569;">已审批口径</div><div style="font-size: 30px; font-weight: 700; margin: 8px 0 4px;">{{approvedMetrics}}</div><div style="font-size: 12px; color: #B45309;">{{metricHint}}</div></div>
              <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px;"><div style="font-size: 13px; color: #475569;">Agent 调用 · 近 7 天</div><div style="font-size: 30px; font-weight: 700; margin: 8px 0 4px;">[调用次数]</div><div style="font-size: 12px; color: #475569;">纠正率 [比例]</div></div>
            </section>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
              <section aria-label="我的待办" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                  <h2 style="margin: 0; font-size: 15px;">我的待办</h2>
                  <button type="button" onClick="{{goApprovals}}" style="border: 0; background: transparent; color: #1D4ED8; font: inherit; font-size: 13px; cursor: pointer;">全部 {{pendingCount}} 项</button>
                </div>
                <template data-sc="for" list="{{pendingItems}}" as="p" hint-placeholder-count="3">
                  <button type="button" onClick="{{p.open}}" style="display: flex; gap: 12px; width: 100%; text-align: left; padding: 12px 0; border: 0; border-top: 1px solid #F1F5F9; background: transparent; font: inherit; color: #0F172A; cursor: pointer;">
                    <span style="{{p.tagStyle}}">{{p.kind}}</span><span style="flex-grow: 1; font-size: 14px;">{{p.title}}</span>
                  </button>
                </template>
                <template data-sc="if" value="{{noPending}}" hint-placeholder-val="{{ false }}"><div style="padding: 16px 0; font-size: 13px; color: #475569;">没有待办了</div></template>
              </section>
              <section aria-label="最近的数据资产" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 18px 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                  <h2 style="margin: 0; font-size: 15px;">最近浏览的数据资产</h2>
                  <button type="button" onClick="{{goExplore}}" style="border: 0; background: transparent; color: #1D4ED8; font: inherit; font-size: 13px; cursor: pointer;">去探索</button>
                </div>
                <template data-sc="for" list="{{recentAssets}}" as="ra" hint-placeholder-count="3">
                  <button type="button" onClick="{{ra.open}}" style="display: block; width: 100%; text-align: left; padding: 11px 0; border: 0; border-top: 1px solid #F1F5F9; background: transparent; font: inherit; color: #0F172A; cursor: pointer;">
                    <span style="display: block; font-size: 12px; color: #475569;">{{ra.path}}</span>
                    <span style="display: block; font-size: 14px; margin-top: 2px;"><span style="font-family: 'JetBrains Mono', monospace; color: #1D4ED8;">{{ra.name}}</span>　{{ra.display}}</span>
                  </button>
                </template>
              </section>
            </div>
          </div>
        </template>

        <template data-sc="if" value="{{isApprovals}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 18px; padding: 22px 24px; align-items: flex-start;">
            <section aria-label="待办列表" style="flex: 1 1 320px; max-width: 400px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; overflow: hidden;">
              <template data-sc="for" list="{{approvalRows}}" as="a" hint-placeholder-count="3">
                <button type="button" onClick="{{a.pick}}" style="{{a.rowStyle}}">
                  <span style="display: flex; align-items: center; gap: 8px;"><span style="{{a.tagStyle}}">{{a.kind}}</span><span style="{{a.statusStyle}}">{{a.statusLabel}}</span></span>
                  <span style="display: block; font-size: 14px; font-weight: 500; margin: 8px 0 4px; color: #0F172A;">{{a.title}}</span>
                  <span style="display: block; font-size: 12px; color: #475569;">{{a.meta}}</span>
                </button>
              </template>
            </section>
            <section aria-label="待办详情" style="flex: 999 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
              <div>
                <div style="font-size: 12px; color: #475569;">{{sel.kind}} · {{sel.statusLabel}}</div>
                <h2 style="margin: 6px 0 4px; font-size: 20px;">{{sel.title}}</h2>
                <div style="font-size: 13px; color: #475569;">{{sel.meta}}</div>
              </div>
              <template data-sc="if" value="{{selIsMetric}}" hint-placeholder-val="{{ true }}">
                <div aria-label="口径差异" style="border: 1px solid #E2E8F0; border-radius: 10px; overflow: hidden;">
                  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
                    <div style="padding: 16px 18px; border-right: 1px solid #E2E8F0;"><div style="font-size: 13px; font-weight: 600;">口径 A · 帆软现有报表</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #334155; margin: 8px 0 12px;">（首次合格 + 返工后合格）÷ 投入</div><div style="font-size: 12px; color: #475569;">2 号线 · 2026-09</div><div style="font-size: 28px; font-weight: 700;">99.89%</div></div>
                    <div style="padding: 16px 18px;"><div style="font-size: 13px; font-weight: 600;">口径 B · 严格口径</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #334155; margin: 8px 0 12px;">首次合格 ÷ 投入</div><div style="font-size: 12px; color: #475569;">2 号线 · 2026-09</div><div style="font-size: 28px; font-weight: 700;">98.69%</div></div>
                  </div>
                  <div style="background: #FFFBEB; border-top: 1px solid #FDE68A; padding: 12px 18px; font-size: 13px; color: #78350F;">差 1.20 个百分点，来自 720 件返工后合格（投入 60,000，首次合格 59,213，报废 67）</div>
                </div>
              </template>
              <template data-sc="if" value="{{selHasBody}}" hint-placeholder-val="{{ false }}">
                <div style="font-size: 14px; color: #334155; line-height: 1.75;">{{sel.body}}</div>
              </template>
              <template data-sc="if" value="{{selPending}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                  <template data-sc="for" list="{{selActions}}" as="act" hint-placeholder-count="2">
                    <button type="button" onClick="{{act.run}}" style="{{act.style}}">{{act.label}}</button>
                  </template>
                  <button type="button" onClick="{{askAboutSelection}}" style="height: 40px; padding: 0 14px; border: 0; background: transparent; color: #1D4ED8; font: inherit; font-size: 14px; margin-left: auto; cursor: pointer;">问 Agent</button>
                </div>
              </template>
              <template data-sc="if" value="{{selDone}}" hint-placeholder-val="{{ false }}">
                <div style="background: #F0FDF4; border: 1px solid #BBF7D0; color: #166534; border-radius: 8px; padding: 12px 14px; font-size: 14px;">{{sel.result}}</div>
              </template>
            </section>
          </div>
        </template>

        <template data-sc="if" value="{{isExplore}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box;">
            <section aria-label="筛选" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 14px;">
              <div style="display: flex; flex-wrap: wrap; gap: 4px; align-items: center;">
                <template data-sc="for" list="{{filters}}" as="fl" hint-placeholder-count="9">
                  <button type="button" onClick="{{fl.pick}}" style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 13px; color: #334155; display: flex; align-items: center; gap: 4px; cursor: pointer;">{{fl.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
                </template>
                <div style="flex-grow: 1"></div>
                <label style="font-size:13px;color:#475569">排序：<select aria-label="资产排序" value="{{sort}}" onChange="{{onSort}}" style="font:inherit;border:1px solid #CBD5E1;border-radius:6px;padding:5px"><option value="relevance">相关度</option><option value="name">名称 A–Z</option><option value="nameDesc">名称 Z–A</option></select></label>
              </div>
              <div style="font-size: 12px; color: #475569; padding: 6px 10px 2px; display: flex; gap: 6px; align-items: center;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg>{{filterHint}}
              </div>
              <template data-sc="if" value="{{filterOpen}}">
                <fieldset style="border:1px solid #CBD5E1;border-radius:8px;margin:10px 0;padding:12px;display:flex;gap:12px;flex-wrap:wrap">
                  <legend>{{filterTitle}} · 同项多选为“或”</legend>
                  <template data-sc="for" list="{{filterOptions}}" as="op"><button type="button" role="checkbox" aria-checked="{{op.checked}}" onClick="{{op.toggle}}" style="{{op.style}}">{{op.label}}</button></template>
                  <button type="button" onClick="{{closeFilter}}">完成</button>
                </fieldset>
              </template>
              <div aria-label="已选条件" style="display:flex;gap:8px;flex-wrap:wrap;padding:8px">
                <template data-sc="for" list="{{chips}}" as="chip"><button type="button" onClick="{{chip.remove}}" aria-label="{{chip.removeLabel}}" style="border:1px solid #BFDBFE;background:#EFF6FF;color:#1D4ED8;padding:5px 8px;border-radius:6px">{{chip.label}} ×</button></template>
                <template data-sc="if" value="{{hasConditions}}"><button type="button" onClick="{{clearSearch}}">清空全部</button></template>
              </div>
            </section>
            <div role="status" style="font-size:13px;color:#475569">{{resultLabel}}</div>
            <template data-sc="if" value="{{detailOpen}}"><section aria-label="资产详情预览" style="background:white;border:1px solid #CBD5E1;border-radius:12px;padding:16px"><button type="button" onClick="{{closeDetail}}">← 返回搜索结果</button><h2>{{asset.name}}</h2><p>{{asset.description}}</p><p>原型 · 同一资产的详情入口；004 先演示摘要与字段，不包含后续业务对象实例视图。</p><button type="button" onClick="{{askAsset}}">问这个资产</button></section></template>
            <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start;">
              <section aria-label="资产列表" style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
                <template data-sc="if" value="{{noAssets}}"><div style="padding:36px;background:white;border-radius:12px;text-align:center"><h3>没有匹配的资产</h3><p>尝试其他关键词，或移除筛选条件。Agent 不会读取空结果之外的资产。</p><button type="button" onClick="{{clearSearch}}">清空搜索与筛选</button></div></template>
                <template data-sc="for" list="{{assetCards}}" as="ac" hint-placeholder-count="4">
                  <article tabindex="0" role="button" aria-label="{{ac.selectLabel}}" aria-pressed="{{ac.selected}}" onClick="{{ac.pick}}" onKeyDown="{{ac.key}}" style="{{ac.style}}">
                    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #475569;">{{ac.path}}</span>
                    <span style="display: flex; align-items: center; gap: 8px; margin-top: 6px;"><span style="{{ac.typeStyle}}">{{ac.type}}</span><button type="button" onClick="{{ac.open}}" style="font:inherit;font-size:16px;color:#1D4ED8;background:transparent;border:0;text-decoration:underline;cursor:pointer">{{ac.name}}</button></span>
                    <span style="display: block; font-size: 14px; color: #0F172A; margin-top: 6px;">{{ac.display}}</span>
                    <span style="display: block; font-size: 12px; color: #475569; margin-top: 6px;">{{ac.meta}}</span>
                  </article>
                </template>
              </section>
              <template data-sc="if" value="{{showSummary}}" hint-placeholder-val="{{ true }}">
                <section aria-label="资产摘要" style="flex: 1 1 300px; max-width: 360px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
                  <div style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 16px; font-weight: 600; color: #1D4ED8; font-family: 'JetBrains Mono', monospace;">{{asset.name}}</span><span style="{{asset.typeStyle}}">{{asset.type}}</span></div>
                  <button type="button" onClick="{{askAsset}}" style="padding:8px;border:1px solid #BFDBFE;background:#EFF6FF;color:#1D4ED8;border-radius:6px;cursor:pointer">问这个资产</button>
                  <template data-sc="for" list="{{asset.props}}" as="pp" hint-placeholder-count="6">
                    <div style="border-top: 1px solid #F1F5F9; padding-top: 12px;">
