repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: ^third_party/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: ^third_party/
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        types_or: [javascript, ts, tsx]
        exclude: ^third_party/
