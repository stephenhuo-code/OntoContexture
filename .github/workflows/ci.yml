name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SYFT_IMAGE: anchore/syft:v1.54.1
  GRYPE_IMAGE: anchore/grype:v0.120.1
  TRIVY_IMAGE: aquasec/trivy:0.76.0
  OASDIFF_IMAGE: tufin/oasdiff:v1.33.0

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # 单元、契约、集成测试（集成测试用 Testcontainers）；覆盖率 < 80% 时失败
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.json
      - run: make components-check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # 前端 API 客户端须与 contracts/openapi/bff.yaml 一致
      - run: pnpm --filter @contexture/ts-api check
      - run: pnpm --filter @contexture/web test:coverage
      - run: pnpm --filter @contexture/ui test:coverage
      - run: pnpm --filter @contexture/web build
      - run: pnpm --filter @contexture/ui build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: |
            apps/web/coverage/
            packages/ui/coverage/


  # 云端脚本（030）：bash 单元测试在 kcov 下统计覆盖率；helmfile 渲染对比（本地 local / lite 不变）；流水线语法检查
  cloud-scripts:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends kcov jq git curl ca-certificates openssl tar make
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: 安装 tools/cloud/tools.lock 锁定的 helm / helmfile
        run: |
          tools/cloud/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: CTX_KCOV=1 make cloud-unit
      - run: tools/cloud/tests/render-compare.sh
      - name: 流水线语法检查（actionlint）
        run: |
          curl -fsSL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint && /tmp/actionlint -shellcheck=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-bash
          path: coverage/bash/cobertura.xml

  coverage:
    needs: [python, web, cloud-scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: 新增与修改行覆盖率 ≥80%
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python -m tools.coverage_gate --base "$DIFF_BASE" --python coverage.json --lcov apps/web/coverage/lcov.info --lcov packages/ui/coverage/lcov.info --cobertura cobertura.xml

  # 补丁一致性（宪法 VI）：third_party 发布分支相对上游的提交须与 PATCHES.md 一一对应
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --package contexture-tools --frozen
      - run: make patches-check

  # 契约破坏性变更：与主分支的 contracts/openapi/ 比较
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: oasdiff breaking
        # 取出目标分支的整个 contracts/：契约以相对路径引用 schemas/，只取单个文件会解析失败
        run: |
          mkdir -p /tmp/base
          git archive "origin/${{ github.base_ref }}" contracts | tar -x -C /tmp/base
          for spec in contracts/openapi/*.yaml; do
            if [[ -f "/tmp/base/$spec" ]]; then
              docker run --rm -v "$PWD:/head" -v /tmp/base:/base "$OASDIFF_IMAGE" \
                breaking "/base/$spec" "/head/$spec" --fail-on ERR
            else
              echo "新增契约：$spec"
            fi
          done

  # 交付镜像：SBOM、许可检查、漏洞扫描
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --package contexture-tools --frozen
      - name: build bff、web
        run: |
          docker build -f services/bff/Dockerfile -t contexture/bff:ci .
          docker build -f apps/web/Dockerfile -t contexture/web:ci .
          docker build -f apps/web/Dockerfile --target frontend-dependencies -t contexture/web-dependencies:ci .
      - name: SBOM（Syft，CycloneDX）
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            "$SYFT_IMAGE" contexture/bff:ci -o cyclonedx-json=/out/bff.cdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            "$SYFT_IMAGE" contexture/web:ci -o cyclonedx-json=/out/web.cdx.json
          # 安装阶段涵盖实际打包 npm 包，并包含构建工具；不把 nginx 系统清单当成前端 SBOM。
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            "$SYFT_IMAGE" contexture/web-dependencies:ci -o cyclonedx-json=/out/web-dependencies.cdx.json
      - name: 许可检查（tools/license-allowlist.yaml）
        run: |
          for file in sbom/*.cdx.json; do
            uv run python -m tools.license_check "$file"
          done
      - name: 漏洞扫描（Grype）
        run: |
          for file in sbom/*.cdx.json; do
            docker run --rm -v "$PWD/sbom:/sbom" "$GRYPE_IMAGE" "sbom:/sbom/$(basename "$file")" \
              --only-fixed --fail-on critical
          done
      - name: 漏洞扫描（Trivy）
        run: |
          for image in contexture/bff:ci contexture/web:ci contexture/web-dependencies:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
              image --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
