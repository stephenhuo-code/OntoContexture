<text x="20" y="864" font-size="12" fill="#59636e">已定：AI 网关 agentgateway（ADR-0013）；可观测后端 Prometheus + Jaeger + OpenSearch Dashboards。待定：是否多租户另行评估（ADR-0007）。详见 docs/architecture/platform-architecture.md。</text>
