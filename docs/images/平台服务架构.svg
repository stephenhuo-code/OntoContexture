<text x="20" y="36" font-size="22" font-weight="600" fill="#1f2328">织境平台服务架构（Phase 1）</text>
<text x="20" y="62" font-size="13" fill="#59636e">单租户：一套环境服务一个客户，可有多个用户与 Agent。自建只有 web（前端）、bff、pipelines 与公共库，其余为以独立服务集成的开源组件。依据宪法 v1.5.0、ADR-0001～0013。</text>
