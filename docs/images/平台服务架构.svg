<text x="525.0" y="293" font-size="11.5" fill="#59636e" text-anchor="middle">本体读写 → OM；审批待办 → OM 任务</text>
<text x="525.0" y="310" font-size="11.5" fill="#59636e" text-anchor="middle">决策轨迹 → Langfuse；Omnigent 会话代理</text>
<text x="525.0" y="327" font-size="11.5" fill="#59636e" text-anchor="middle">页面取数 → AI 网关（MCP 客户端）</text>
