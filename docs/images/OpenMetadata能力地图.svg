roke="#1e8e3e" stroke-width="1.5" /><text x="1174" y="657" font-size="13.5" font-weight="600" fill="#1f2328">治理工作流</text><text x="1174" y="678" font-size="11.5" fill="#59636e">Flowable；审批、条件、定时触发</text><rect x="170" y="704" width="236" height="60" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="1.5" /><text x="182" y="729" font-size="13.5" font-weight="600" fill="#1f2328">策略与角色</text><text x="182" y="750" font-size="11.5" fill="#59636e">hasDomain 等；仅 OM 内实体级</text><rect x="418" y="704" width="236" height="60" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="1.5" /><text x="430" y="729" font-size="13.5" font-weight="600" fill="#1f2328">Domain / 数据产品</text><text x="430" y="750" font-size="11.5" fill="#59636e">软隔离；列表靠搜索后过滤</text><rect x="666" y="704" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="678" y="729" font-size="13.5" font-weight="600" fill="#1f2328">血缘</text><text x="678" y="750" font-size="11.5" fill="#59636e">表级、字段级、OpenLineage</text><rect x="914" y="704" width="236" height="60" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="1.5" /><text x="926" y="729" font-size="13.5" font-weight="600" fill="#1f2328">审计日志</text><text x="926" y="750" font-size="11.5" fill="#59636e">只记写操作 → 读审计织境自建</text><rect x="1162" y="704" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" /><text x="1174" y="729" font-size="13.5" font-weight="600" fill="#1f2328">列级 / 行级访问控制</text><text x="1174" y="750" font-size="11.5" fill="#59636e">不提供 → 二期（SQL 网关）</text><rect x="170" y="776" width="236" height="60" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="182" y="801" font-size="13.5" font-weight="600" fill="#1f2328">标签沿血缘传播等</text><text x="182" y="822" font-size="11.5" fill="#59636e">Collate 专有</text><rect x="20" y="864" width="1390" height="86" rx="10" fill="#fafbfc" stroke="#d0d7de"/><text x="36" y="912.0" font-size="15" font-weight="600" fill="#1f2328">采集与编排层</text><rect x="170" y="874" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="182" y="899" font-size="13.5" font-weight="600" fill="#1f2328">采集管道 API</text><text x="182" y="920" font-size="11.5" fill="#59636e">部署、触发、状态回写</text><rect x="418" y="874" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="430" y="899" font-size="13.5" font-weight="600" fill="#1f2328">连接器与剖析框架</text><text x="430" y="920" font-size="11.5" fill="#59636e">Python 采集框架</text><rect x="614" y="882" width="32" height="16" rx="4" fill="#fce8e6" stroke="#d93025"/><text x="630" y="894" font-size="10" font-weight="600" fill="#d93025" text-anchor="middle">CCL</text><rect x="666" y="874" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="678" y="899" font-size="13.5" font-weight="600" fill="#1f2328">Airflow 客户端</text><text x="678" y="920" font-size="11.5" fill="#59636e">2.x 保留，兼容 Airflow 3</text><rect x="862" y="882" width="32" height="16" rx="4" fill="#fce8e6" stroke="#d93025"/><text x="878" y="894" font-size="10" font-weight="600" fill="#d93025" text-anchor="middle">CCL</text><rect x="914" y="874" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="926" y="899" font-size="13.5" font-weight="600" fill="#1f2328">K8s 原生 / Noop 客户端</text><text x="926" y="920" font-size="11.5" fill="#59636e">可交由外部编排器</text><rect x="1162" y="874" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="1174" y="899" font-size="13.5" font-weight="600" fill="#1f2328">外部运行回写</text><text x="1174" y="920" font-size="11.5" fill="#59636e">pipelineStatus、测试结果</text><rect x="20" y="962" width="1390" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="36" y="987" font-size="13" fill="#1f2328"><tspan font-weight="600">运行依赖：</tspan>MySQL / PostgreSQL · OpenSearch / Elasticsearch · Jena Fuseki（可选） · 对象存储（文件上传必需） · LLM 与嵌入模型（