<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="1054" viewBox="0 0 1430 1054" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" role="img" aria-label="OpenMetadata 2.0.3 能力地图：按接口、上下文、本体与语义、数据治理、采集与编排分层，标注织境的复用与自建"><rect width="1430" height="1054" fill="#ffffff"/><text x="20" y="36" font-size="22" font-weight="600" fill="#1f2328">OpenMetadata 2.0.3 能力地图：织境的复用与自建</text><text x="20" y="64" font-size="13" fill="#59636e">依据 2.0.3-release 源码、发布说明与官方文档（2026-10-04）。</text><text x="20" y="86" font-size="13" fill="#59636e">绿 = 直接复用；橙 = 复用需扩展；蓝 = 织境自建或替代；灰虚线 = Collate 专有 / 未提供 / 不使用；红色 CCL 标记 = 该模块为 Collate Community License。</text><rect x="20" y="112" width="1390" height="86" rx="10" fill="#fafbfc" stroke="#d0d7de"/><text x="36" y="160.0" font-size="15" font-weight="600" fill="#1f2328">接口层</text><rect x="170" y="122" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="182" y="147" font-size="13.5" font-weight="600" fill="#1f2328">REST API</text><text x="182" y="168" font-size="11.5" fill="#59636e">openmetadata-service，Apache 2.0</text><rect x="418" y="122" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="430" y="147" font-size="13.5" font-weight="600" fill="#1f2328">MCP 服务（15 个工具）</text><text x="430" y="168" font-size="11.5" fill="#59636e">CCL 例外已批准，供客户 Agent 使用</text><rect x="614" y="130" width="32" height="16" rx="4" fill="#fce8e6" stroke="#d93025"/><text x="630" y="142" font-size="10" font-weight="600" fill="#d93025" text-anchor="middle">CCL</text><rect x="666" y="122" width="236" height="60" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="678" y="147" font-size="13.5" font-weight="600" fill="#1f2328">AI SDK</text><text x="678" y="168" font-size="11.5" fill="#59636e">客户端；Agent 功能需 Collate</text><rect x="862" y="130" width="32" height="16" rx="4" fill="#fce8e6" stroke="#d93025"/><text x="878" y="142" font-size="10" font-weight="600" fill="#d93025" text-anchor="middle">CCL</text><rect x="914" y="122" width="236" height="60" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="926" y="147" font-size="13.5" font-weight="600" fill="#1f2328">OM 界面</text><text x="926" y="168" font-size="11.5" fill="#59636e">不交付，仅内部使用</text><rect x="1110" y="130" width="32" height="16" rx="4" fill="#fce8e6" stroke="#d93025"/><text x="1126" y="142" font-size="10" font-weight="600" fill="#d93025" text-anchor="middle">CCL</text><rect x="1162" y="122" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="1174" y="147" font-size="13.5" font-weight="600" fill="#1f2328">变更事件与订阅</text><text x="1174" y="168" font-size="11.5" fill="#59636e">/v1/events、Webhook、偏移同步</text><rect x="20" y="210" width="1390" height="158" rx="10" fill="#fafbfc" stroke="#d0d7de"/><text x="36" y="294.0" font-size="15" font-weight="600" fill="#1f2328">上下文层</text><rect x="170" y="220" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="182" y="245" font-size="13.5" font-weight="600" fill="#1f2328">文章与快捷链接</text><text x="182" y="266" font-size="11.5" fill="#59636e">/v1/contextCenter/pages</text><rect x="418" y="220" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="430" y="245" font-size="13.5" font-weight="600" fill="#1f2328">文件（Drive）</text><text x="430" y="266" font-size="11.5" fill="#59636e">上传与版本；需对象存储</text><rect x="666" y="220" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" /><text x="678" y="245" font-size="13.5" font-weight="600" fill="#1f2328">知识片抽取</text><text x="678" y="266" font-size="11.5" fill="#59636e">2.0.3 仅纯文本 → 织境自建</text><rect x="914" y="220" width="236" height="60" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="1.5" /><text x="926" y="245" font-size="13.5" font-weight="600" fill="#1f2328">记忆（Memory）</text><text x="926" y="266" font-size="11.5" fill="#59636e">有来源与共享；无审批、时效</text><rect x="1162" y="220" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="1174" y="245" font-size="13.5" font-weight="600" fill="#1f2328">资产 AI 上下文</text><text x="1174" y="266" font-size="11.5" fill="#59636e">/v1/{实体}/{id}/context</text><rect x="170" y="292" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="182" y="317" font-size="13.5" font-weight="600" fill="#1f2328">Persona 上下文</text><text x="182" y="338" font-size="11.5" fill="#59636e">按规则编译上下文文档</text><rect x="418" y="292" width="236" height="60" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="1.5" /><text x="430" y="317" font-size="13.5" font-weight="600" fill="#1f2328">语义 / 混合检索</text><text x="430" y="338" font-size="11.5" fill="#59636e">需配置嵌入模型</text><rect x="666" y="292" width="236" height="60" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="678" y="317" font-size="13.5" font-weight="600" fill="#1f2328">Agent、自动化、对话沉淀</text><text x="678" y="338" font-size="11.5" fill="#59636e">Collate 专有</text><rect x="20" y="380" width="1390" height="230" rx="10" fill="#fafbfc" stroke="#d0d7de"/><text x="36" y="500.0" font-size="15" font-weight="600" fill="#1f2328">本体与语义层</text><rect x="170" y="390" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="182" y="415" font-size="13.5" font-weight="600" fill="#1f2328">术语库与层级</text><text x="182" y="436" font-size="11.5" fill="#59636e">单父树；承载类型、属性、关系类型</text><rect x="418" y="390" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="430" y="415" font-size="13.5" font-weight="600" fill="#1f2328">类型化关系</text><text x="430" y="436" font-size="11.5" fill="#59636e">10 种系统类型 + 可自定义类型</text><rect x="666" y="390" width="236" height="60" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="1.5" /><text x="678" y="415" font-size="13.5" font-weight="600" fill="#1f2328">自定义属性</text><text x="678" y="436" font-size="11.5" fill="#59636e">按实体类型全局 → 作术语共用字段</text><rect x="914" y="390" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="926" y="415" font-size="13.5" font-weight="600" fill="#1f2328">字段关联术语</text><text x="926" y="436" font-size="11.5" fill="#59636e">字段 → 属性术语，即映射</text><rect x="1162" y="390" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="1174" y="415" font-size="13.5" font-weight="600" fill="#1f2328">字段自定义属性</text><text x="1174" y="436" font-size="11.5" fill="#59636e">存放映射规则</text><rect x="170" y="462" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="182" y="487" font-size="13.5" font-weight="600" fill="#1f2328">术语审批与版本</text><text x="182" y="508" font-size="11.5" fill="#59636e">草稿 → 评审 → 通过；版本历史</text><rect x="418" y="462" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="430" y="487" font-size="13.5" font-weight="600" fill="#1f2328">OWL / SKOS 导入导出</text><text x="430" y="508" font-size="11.5" fill="#59636e">无公理与推理</text><rect x="666" y="462" width="236" height="60" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="1.5" /><text x="678" y="487" font-size="13.5" font-weight="600" fill="#1f2328">RDF / SPARQL（Fuseki）</text><text x="678" y="508" font-size="11.5" fill="#59636e">Beta、仅管理员 → 只内部使用</text><rect x="914" y="462" width="236" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" /><text x="926" y="487" font-size="13.5" font-weight="600" fill="#1f2328">SHACL 校验</text><text x="926" y="508" font-size="11.5" fill="#59636e">2.0.3 未提供 → 织境自建</text><rect x="1162" y="462" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" /><text x="1174" y="487" font-size="13.5" font-weight="600" fill="#1f2328">Metric 实体</text><text x="1174" y="508" font-