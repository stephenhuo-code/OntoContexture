openapi: 3.1.0
info:
  title: 织境 bff 接口
  version: 0.1.0
  description: |
    织境 Web 的后端（BFF 模式，ADR-0003）。
    取数不经自建 REST 服务：bff 经 AI 网关以 MCP 调用 MCP Toolbox 的工具（ADR-0013），契约在 contracts/mcp/。
    鉴权二选一：浏览器使用会话 Cookie（令牌只在 bff）；直接调用使用 Bearer 令牌（受众须含 contexture-bff）。
    错误统一使用 contracts/schemas/error.json。
    受保护的 Web 接口仅允许受信身份中的 admin 或 ai-engineer；不改变其他客户端的角色规则。
    登录导航失败以 303 回到同源恢复页；退出仅结束当前织境会话，不调用 IdP logout。
servers:
  - url: /
security:
  - session: []
  - bearer: []
paths:
  # ---------- bff（浏览器唯一入口，ADR-0003） ----------
  /bff/v1/auth/login:
    get:
      operationId: bffLogin
      summary: 跳转 Keycloak 登录（BFF 模式：令牌只在 bff，浏览器只持有会话 Cookie）
      description: |
        主动登录统一携带 prompt=login，要求 Keycloak 重新认证；已有企业 SSO 不直接跳过认证页面。
        首次登录、退出后登录和失败恢复共用此规则；正常会话检查及令牌刷新不经过本入口。
        prompt 由 BFF 固定，不提供浏览器覆盖参数；退出仍只结束织境会话，不调用 IdP logout。
      security: []
      parameters:
        - name: return_to
          in: query
          description: 安全站内路径与查询；拒绝站外、双斜线、反斜杠和控制字符；缺省或不安全时回到 /home。
          schema: { type: string }
      responses:
        "302": { description: 重定向到 Keycloak 授权端点 }
        "303": { $ref: "#/components/responses/LoginFailure" }
        default: { $ref: "#/components/responses/Error" }
  /bff/v1/auth/callback:
    get:
      operationId: bffLoginCallback
      summary: Keycloak 回调；换取令牌、建立会话后跳回页面
      security: []
      description: |
        成功形式为 code + state，拒绝形式为 error + state；code 与 error 互斥，均不得重复或为空。
        先校验并一次性消费 state，只有合法成功形式才换码；缺失、过期、重放或无效参数均走 303，避免框架 422。
        只有已验证登录请求的安全 return_to 可恢复；无效 state 的恢复目标固定 /home。
        不透传 code、state、token、error_description、上游 URL 或堆栈，不清除其他既有有效本地会话。
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: 建立 HttpOnly 会话 Cookie 后跳回安全 return_to }
        "303": { $ref: "#/components/responses/LoginFailure" }
        default: { $ref: "#/components/responses/Error" }
  /bff/v1/auth/logout:
    post:
      operationId: bffLogout
      summary: 结束当前织境本地会话（无会话时幂等返回 204）
      description: 删除当前会话及其中保存的令牌、过期 Cookie；不调用 IdP logout，不结束企业 SSO 或其他客户端会话。删除失败返回 500，不能伪报退出成功。
      security: []
      responses:
        "204": { description: 当前本地会话已结束，Cookie 过期；无响应正文 }
        "500": { $ref: "#/components/responses/Error" }
  /bff/v1/me:
    get:
      operationId: bffGetMe
      summary: 当前用户（含部署常量 tenant_id）
      description: 认证后要求 admin 或 ai-engineer；拒绝先于下游访问。临时身份依赖故障不使用过期令牌且保留会话。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /bff/v1/object-types/{typeKey}:
    get:
      operationId: bffGetObjectType
      summary: 对象类型定义（OM 中已审批的对象及其属性）
      description: 认证后要求 admin 或 ai-engineer；拒绝先于下游访问。临时身份依赖故障不使用过期令牌且保留会话。
      parameters:
        - {
            name: typeKey,
            in: path,
            required: true,
            schema: { type: string },
            example: equipment,
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectTypeRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /bff/v1/object-types/{typeKey}/objects:
    get:
      operationId: bffListObjects
      summary: 示例查询：对象类型定义 + 该类型的对象实例
      description: 认证后要求 admin 或 ai-engineer；拒绝先于下游访问。临时身份依赖故障不使用过期令牌且保留会话。
      parameters:
        - {
            name: typeKey,
            in: path,
            required: true,
            schema: { type: string },
            example: equipment,
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectListView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: ctx_session }
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    LoginFailure:
      description: 浏览器登录未完成，跳转同源公共恢复页；原因只影响展示，不授予身份或权限。
      headers:
        Location:
          required: true
          description: 固定 /auth/error，reason 枚举；可选 32 位十六进制 trace_id 与编码的安全站内 return_to。不得包含敏感回调参数。
          schema:
            type: string
            pattern: '^/auth/error\?reason=(cancelled|invalid_response|unavailable|internal)(&|$)'
        Cache-Control:
          required: true
          schema: { type: string, enum: [no-store] }
        Referrer-Policy:
          required: true
          schema: { type: string, enum: [no-referrer] }
    Unauthorized:
      description: 缺少、失效或过期身份，包括明确 invalid_grant；401 终止无效会话。
      content:
        application/json:
          schema: { $ref: "../schemas/error.json" }
    Forbidden:
      description: 受众错误 auth.invalid_audience 或缺少 Web 角色 auth.web_access_denied；拒绝后仍可退出，不重登循环。
      content:
        application/json:
          schema: { $ref: "../schemas/error.json" }
    Unavailable:
      description: IdP / JWKS 暂时网络或 5xx 故障，upstream.unavailable；保留会话记录，不使用过期令牌。
      content:
        application/json:
          schema: { $ref: "../schemas/error.json" }
    Error:
      description: 统一错误格式
      content:
        application/json:
          schema: { $ref: "../schemas/error.json" }
  schemas:
    Me:
      type: object
      required: [tenant_id, user_id]
      properties:
        tenant_id: { type: string }
        user_id: { type: string }
        display_name:
          type: string
          description: 姓名、用户名、用户 ID 依次回退；v1 保持字符串保证，可缺省。
        roles: { type: array, items: { type: string } }
    ObjectTypeRef:
      type: object
      required: [type_uri, name, version, attributes]
      properties:
        type_uri: { type: string, example: "urn:ctx:object:quality:Equipment" }
        name: { type: string }
        display_name: { type: string }
        version: { type: string }
        attributes:
          type: array
          items:
            type: object
            required: [name, data_type]
            properties:
              name: { type: string }
              data_type: { type: string }
              required: { type: boolean }
              data_level: { type: integer }
    ObjectInstance:
      type: object
      required: [object_uri, type_uri, attributes]
      properties:
        object_uri:
          { type: string, example: "urn:ctx:obj:local:Equipment:CNC-07" }
        type_uri: { type: string }
        attributes: { type: object, additionalProperties: true }
        source: { type: string }
    ObjectListView:
      type: object
      required: [object_type, items]
      properties:
        object_type: { $ref: "#/components/schemas/ObjectTypeRef" }
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/ObjectInstance" },
          }
        trace_id: { type: string, description: 用于查询本次取数的审计记录 }
