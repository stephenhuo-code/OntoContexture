openapi: 3.1.0
info:
  title: 织境 bff 接口
  version: 0.3.0
  description: |
    织境 Web 的后端（BFF 模式，ADR-0003）。
    取数不经自建 REST 服务：bff 经 AI 网关以 MCP 调用 MCP Toolbox 的工具（ADR-0013），契约在 contracts/mcp/。
    鉴权二选一：浏览器使用会话 Cookie（令牌只在 bff）；直接调用使用 Bearer 令牌（受众须含 contexture-bff）。
    错误统一使用 contracts/schemas/error.json。
    受保护的 Web 接口仅允许受信身份中的 admin 或 ai-engineer；不改变其他客户端的角色规则。
    登录导航失败以 303 回到同源恢复页；退出仅结束当前织境会话，不调用 IdP logout。
    005 源系统元数据采集错误码：source.name_conflict、source.deploy_failed、source.pipeline_in_flight、source.schedule_not_set、
    source.immutable_field、upstream.unavailable；上游不可用时如实返回错误，不返回示例数据。
    006 资产搜索与摘要错误码：search.invalid_criteria（422）、search.window_exceeded（422）、search.index_missing（503）、
    search.timeout（504）；沿用 upstream.unavailable、catalog.not_found、auth.om_forbidden。浏览器只提交结构化条件，
    BFF 生成并校验 OM 查询；数据全部来自 OpenMetadata，不返回示例数据。
servers:
  - url: /
security:
  - session: []
  - bearer: []
paths:
  # ---------- bff（浏览器唯一入口，ADR-0003） ----------
  /bff/v1/auth/login:
    get:
      operationId: bffLogin
      summary: 跳转 Keycloak 登录（BFF 模式：令牌只在 bff，浏览器只持有会话 Cookie）
      description: |
        主动登录统一携带 prompt=login，要求 Keycloak 重新认证；已有企业 SSO 不直接跳过认证页面。
        首次登录、退出后登录和失败恢复共用此规则；正常会话检查及令牌刷新不经过本入口。
        prompt 由 BFF 固定，不提供浏览器覆盖参数；退出仍只结束织境会话，不调用 IdP logout。
      security: []
      parameters:
        - name: return_to
          in: query
          description: 安全站内路径与查询；拒绝站外、双斜线、反斜杠和控制字符；缺省或不安全时回到 /home。
          schema: { type: string }
      responses:
        "302": { description: 重定向到 Keycloak 授权端点 }
        "303": { $ref: "#/components/responses/LoginFailure" }
        default: { $ref: "#/components/responses/Error" }
  /bff/v1/auth/callback:
    get:
      operationId: bffLoginCallback
      summary: Keycloak 回调；换取令牌、建立会话后跳回页面
      security: []
      description: |
        成功形式为 code + state，拒绝形式为 error + state；code 与 error 互斥，均不得重复或为空。
        先校验并一次性消费 state，只有合法成功形式才换码；缺失、过期、重放或无效参数均走 303，避免框架 422。
        只有已验证登录请求的安全 return_to 可恢复；无效 state 的恢复目标固定 /home。
        不透传 code、state、token、error_description、上游 URL 或堆栈，不清除其他既有有效本地会话。
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: 建立 HttpOnly 会话 Cookie 后跳回安全 return_to }
        "303": { $ref: "#/components/responses/LoginFailure" }
        default: { $ref: "#/components/responses/Error" }
  /bff/v1/auth/logout:
    post:
      operationId: bffLogout
      summary: 结束当前织境本地会话（无会话时幂等返回 204）
      description: 删除当前会话及其中保存的令牌、过期 Cookie；不调用 IdP logout，不结束企业 SSO 或其他客户端会话。删除失败返回 500，不能伪报退出成功。
      security: []
      responses:
        "204": { description: 当前本地会话已结束，Cookie 过期；无响应正文 }
        "500": { $ref: "#/components/responses/Error" }
  /bff/v1/me:
    get:
      operationId: bffGetMe
      summary: 当前用户（含部署常量 tenant_id）
      description: 认证后要求 admin 或 ai-engineer；拒绝先于下游访问。临时身份依赖故障不使用过期令牌且保留会话。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /bff/v1/object-types/{typeKey}:
    get:
      operationId: bffGetObjectType
      summary: 对象类型定义（OM 中已审批的对象及其属性）
      description: 认证后要求 admin 或 ai-engineer；拒绝先于下游访问。临时身份依赖故障不使用过期令牌且保留会话。
      parameters:
        - {
            name: typeKey,
            in: path,
            required: true,
            schema: { type: string },
            example: equipment,
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectTypeRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /bff/v1/object-types/{typeKey}/objects:
    get:
      operationId: bffListObjects
      summary: 示例查询：对象类型定义 + 该类型的对象实例
      description: 认证后要求 admin 或 ai-engineer；拒绝先于下游访问。临时身份依赖故障不使用过期令牌且保留会话。
      parameters:
        - {
            name: typeKey,
            in: path,
            required: true,
            schema: { type: string },
            example: equipment,
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectListView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ---------- 005 源系统元数据采集（经 OpenMetadata 用户委托令牌，research R5） ----------
  /bff/v1/sources:
    get:
      operationId: listSources
      summary: 数据源列表（含各任务最近运行与已采集统计）
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: 全部数据库类数据源；统计由 BFF 基于 OM 实体实时计算，不持久化
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/SourceSummary" },
                    }
        "502": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createSource
      summary: 新建数据源：保存 DatabaseService 与采集任务，并由 OM 部署到 Airflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceUpsert" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "201":
          description: 已保存并部署；部署失败时不返回 201，而返回 source.deploy_failed（已保存的实体保留，可再次保存重试部署）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          {
            description: "服务标识已存在 source.name_conflict",
            $ref: "#/components/responses/Error",
          }
        "502": { $ref: "#/components/responses/Unavailable" }
  /bff/v1/sources/{name}:
    parameters:
      - $ref: "#/components/parameters/SourceName"
    get:
      operationId: getSource
      summary: 数据源详情（连接信息脱敏、采集范围、各任务调度与最近运行）
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: updateSource
      summary: 修改连接、采集范围与调度；服务标识与连接器不可改（不同于已保存值时 400 source.immutable_field）；密码传 "*********" 表示不变；保存后重新部署
      description: |
        includeViews=false 或 createLineageTask=false 时删除视图血缘任务（OM 实体与其运行记录）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceUpsert" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /bff/v1/sources/test-connection:
    post:
      operationId: startTestConnection
      summary: 发起测试连接（OM automation workflow，异步）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceType, connection]
              properties:
                serviceName:
                  type: [string, "null"]
                  description: 已有数据源时提供；密码为 "*********" 时由 OM 按已保存凭证测试（research R5 验证项 3）
                serviceType: { $ref: "#/components/schemas/ServiceType" }
                connection: { $ref: "#/components/schemas/ConnectionInput" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "202":
          description: 已提交
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestConnectionResult" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /bff/v1/sources/test-connection/{workflowId}:
    get:
      operationId: getTestConnection
      summary: 查询测试连接结果（轮询）
      parameters:
        - {
            name: workflowId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: 进行中或已完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestConnectionResult" }
        "404": { $ref: "#/components/responses/Error" }
  /bff/v1/sources/{name}/pipelines/{kind}/runs:
    parameters:
      - $ref: "#/components/parameters/SourceName"
      - $ref: "#/components/parameters/PipelineKind"
    get:
      operationId: listPipelineRuns
      summary: 当前任务的运行记录（OM PipelineStatus），新到旧
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/PipelineState" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/PipelineRun" },
                    }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /bff/v1/sources/{name}/pipelines/{kind}/trigger:
    parameters:
      - $ref: "#/components/parameters/SourceName"
      - $ref: "#/components/parameters/PipelineKind"
    post:
      operationId: triggerPipeline
      summary: 立即运行（OM trigger）；该任务已有 queued / running 运行时拒绝
      responses:
        "404":
          {
            description: "数据源或任务不存在 source.not_found",
            $ref: "#/components/responses/Error",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "202": { description: 已提交到 Airflow；运行记录以 OM 回写为准 }
        "409":
          {
            description: "source.pipeline_in_flight",
            $ref: "#/components/responses/Error",
          }
        "502": { $ref: "#/components/responses/Unavailable" }
  /bff/v1/sources/{name}/pipelines/{kind}/schedule:
    parameters:
      - $ref: "#/components/parameters/SourceName"
      - $ref: "#/components/parameters/PipelineKind"
    put:
      operationId: setPipelineScheduleEnabled
      summary: 暂停 / 恢复定时调度（OM toggleIngestion）；仅对有定时计划的任务有效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "409":
          {
            description: "Airflow 尚未登记该任务 source.pipeline_not_ready",
            $ref: "#/components/responses/Error",
          }
        "404":
          {
            description: "数据源或任务不存在 source.not_found",
            $ref: "#/components/responses/Error",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineSummary" }
        "400":
          {
            description: "手动任务不支持 source.schedule_not_set",
            $ref: "#/components/responses/Error",
          }
        "502": { $ref: "#/components/responses/Unavailable" }
  /bff/v1/sources/{name}/pipelines/{kind}/logs/last:
    parameters:
      - $ref: "#/components/parameters/SourceName"
      - $ref: "#/components/parameters/PipelineKind"
    get:
      operationId: getLastPipelineLogs
      summary: 该任务最近一次运行的日志（OM 仅提供最近一次，research R7），已脱敏
      responses:
        "404":
          {
            description: "数据源或任务不存在 source.not_found",
            $ref: "#/components/responses/Error",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  runId: { type: [string, "null"], format: uuid }
                  logs: { type: string }
        "502": { $ref: "#/components/responses/Unavailable" }
  /bff/v1/catalog/{entityType}/{fqn}:
    parameters:
      - name: entityType
        in: path
        required: true
        schema:
          {
            type: string,
            enum: [databaseService, database, databaseSchema, table],
          }
      - {
          name: fqn,
          in: path,
          required: true,
          schema: { type: string },
          description: URL 编码的完整 FQN,
        }
    get:
      operationId: getCatalogEntity
      summary: 目录实体（含直接子项、继承来源标注；表含字段与约束）
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntity" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: patchCatalogEntity
      summary: 修改治理属性（转换为 OM JSON Patch）；字段属性经 columnName 定位
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernancePatch" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntity" }
        "400":
          {
            description: "校验失败：域与数据产品不一致、保留周期非 ISO 8601、互斥分类多选",
            $ref: "#/components/responses/Error",
          }
        "404":
          {
            description: "实体不存在 catalog.not_found，或字段不存在 catalog.column_not_found",
            $ref: "#/components/responses/Error",
          }
        "502": { $ref: "#/components/responses/Unavailable" }
  /bff/v1/governance/options:
    get:
      operationId: getGovernanceOptions
      summary: 治理选项（用户、团队、业务域、数据产品、分类与标签、术语），实时读取 OM
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "请求参数不合法 request.invalid（py-core 统一处理）",
            $ref: "#/components/responses/Error",
          }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceOptions" }
        "502": { $ref: "#/components/responses/Unavailable" }

  # ---------- 006 资产搜索与摘要（specs/006-asset-search-summary/contracts/openapi.yaml） ----------
  /bff/v1/assets/search:
    post:
      operationId: searchAssets
      summary: 主结果列表（OM /v1/search/query）
      description: |
        结果只读，使用 POST 是为了在请求体中携带结构化条件。
        index 的选择：criteria.entityType 优先，其次 scope，都没有时用 dataAsset（research R2）。
        BFF 总是带上 deleted=false 与 track_total_hits=true。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchCriteria" }
      responses:
        "200":
          description: 一页结果；total 为 OM 返回的真实总数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        "400":
          {
            description: "请求体不是合法 JSON（http.bad_request）",
            $ref: "#/components/responses/Error",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "search.invalid_criteria / search.window_exceeded / request.invalid",
            $ref: "#/components/responses/Error",
          }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503":
          {
            description: "search.index_missing（OM 返回 500 Failed to find index，research R11）",
            $ref: "#/components/responses/Error",
          }
        "504":
          {
            description: "search.timeout（OpenSearch timed_out=true，不返回部分结果）",
            $ref: "#/components/responses/Error",
          }

  /bff/v1/assets/type-counts:
    post:
      operationId: countAssetTypes
      summary: 按类型计数（OM /v1/search/entityTypeCounts），以及首条命中结果的类型
      description: |
        用于两处：
        - 有关键词时左栏的类型列表（FR-007）；
        - keyword 为空时，提供搜索范围下拉中「有数据的类型」（FR-004）。
        计算计数时忽略 criteria 中的 entityType、scope、sort、page、pageSize。
        只返回计数大于 0 的类型；tableColumn 作为独立类型返回（D8）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchCriteria" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TypeCounts" }
        "400":
          {
            description: "请求体不是合法 JSON（http.bad_request）",
            $ref: "#/components/responses/Error",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }

  /bff/v1/assets/facets:
    post:
      operationId: getAssetFacet
      summary: 单个快速筛选维度的选项与计数（OM /v1/search/aggregate）
      description: |
        计数排除本维度自身的已选条件，同时受关键词、位置与其他维度的条件约束（research R4）。
        选项按 OM 返回的顺序排列（键名字母升序）。
        「无」不在选项中，由前端固定显示，没有计数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [criteria, dimension]
              additionalProperties: false
              properties:
                criteria: { $ref: "#/components/schemas/SearchCriteria" }
                dimension: { $ref: "#/components/schemas/FacetDimension" }
                optionQuery:
                  type: string
                  maxLength: 100
                  description: 选项内搜索的文本；BFF 转义后以 .*文本.* 传给 OM 的 value 参数
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [dimension, options]
                properties:
                  dimension: { $ref: "#/components/schemas/FacetDimension" }
                  supportsNone:
                    { type: boolean, description: 该维度是否提供「无」 }
                  options:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/FacetOption" },
                    }
        "400":
          {
            description: "请求体不是合法 JSON（http.bad_request）",
            $ref: "#/components/responses/Error",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          {
            description: "维度不在白名单内，或仅表类型可用的维度在非表类型下使用",
            $ref: "#/components/responses/Error",
          }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }

  /bff/v1/assets/browse:
    post:
      operationId: browseAssets
      summary: 浏览树的一层节点（OM /v1/search/aggregate；展开时才加载）
      description: |
        parentPath 为空时返回根节点（大类）；否则返回 parentPath 下一层的节点。
        计数受 criteria 中的筛选条件约束；criteria.browsePath 会被忽略，以 parentPath 为准。
        计数为 0 的根节点不返回（FR-006）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [criteria, parentPath]
              additionalProperties: false
              properties:
                criteria: { $ref: "#/components/schemas/SearchCriteria" }
                parentPath:
                  {
                    type: array,
                    maxItems: 5,
                    items: { $ref: "#/components/schemas/BrowseStep" },
                  }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/BrowseNode" },
                    }
        "400":
          {
            description: "请求体不是合法 JSON（http.bad_request）",
            $ref: "#/components/responses/Error",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }

  /bff/v1/assets/suggestions:
    get:
      operationId: suggestAssets
      summary: 输入建议（OM /v1/search/query，size=15；按类型分组，每组最多 5 条）
      parameters:
        - {
            name: keyword,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 200 },
          }
        - {
            name: scope,
            in: query,
            required: false,
            schema: { $ref: "#/components/schemas/EntityType" },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [entityType, items]
                      properties:
                        entityType: { $ref: "#/components/schemas/EntityType" }
                        items:
                          {
                            type: array,
                            maxItems: 5,
                            items: { $ref: "#/components/schemas/Suggestion" },
                          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }

  /bff/v1/assets/summary/{entityType}/{fqn}:
    parameters:
      - {
          name: entityType,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/EntityType" },
        }
      - {
          name: fqn,
          in: path,
          required: true,
          schema: { type: string },
          description: URL 编码的完整 FQN,
        }
    get:
      operationId: getAssetSummary
      summary: 只读摘要（按身份读取 OM 实体；列读取所属表，research R9 / R10）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          {
            description: catalog.not_found,
            $ref: "#/components/responses/Error",
          }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Unavailable" }

  /bff/v1/governance/glossary-terms/{fqn}:
    parameters:
      - { name: fqn, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGlossaryTermDetail
      summary: 业务术语只读详情（OM /v1/glossaryTerms/name/{fqn}）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlossaryTermDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          {
            description: catalog.not_found（实体已删除或不存在）,
            $ref: "#/components/responses/Error",
          }
        "502": { $ref: "#/components/responses/Unavailable" }

  /bff/v1/governance/tags/{fqn}:
    parameters:
      - { name: fqn, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTagDetail
      summary: 分类标签只读详情（OM /v1/tags/name/{fqn}）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          {
            description: catalog.not_found,
            $ref: "#/components/responses/Error",
          }
        "502": { $ref: "#/components/responses/Unavailable" }

components:
  parameters:
    SourceName:
      name: name
      in: path
      required: true
      schema:
        {
          type: string,
          pattern: "^[a-z][a-z0-9-]{1,49}$",
          description: "test-connection 为保留名，不可用作服务标识",
        }
    PipelineKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [metadata, lineage] }
  securitySchemes:
    session: { type: apiKey, in: cookie, name: ctx_session }
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    LoginFailure:
      description: 浏览器登录未完成，跳转同源公共恢复页；原因只影响展示，不授予身份或权限。
      headers:
        Location:
          required: true
          description: 固定 /auth/error，reason 枚举；可选 32 位十六进制 trace_id 与编码的安全站内 return_to。不得包含敏感回调参数。
          schema:
            type: string
            pattern: '^/auth/error\?reason=(cancelled|invalid_response|unavailable|internal)(&|$)'
        Cache-Control:
          required: true
          schema: { type: string, enum: [no-store] }
        Referrer-Policy:
          required: true
          schema: { type: string, enum: [no-referrer] }
    Unauthorized:
      description: 缺少、失效或过期身份，包括明确 invalid_grant；401 终止无效会话。
      content:
        application/json:
          schema: { $ref: "../schemas/error.json" }
    Forbidden:
      description: 受众错误 auth.invalid_audience 或缺少 Web 角色 auth.web_access_denied；拒绝后仍可退出，不重登循环。
      content:
        application/json:
          schema: { $ref: "../schemas/error.json" }
    Unavailable:
      description: IdP / JWKS 暂时网络或 5xx 故障，upstream.unavailable；保留会话记录，不使用过期令牌。
      content:
        application/json:
          schema: { $ref: "../schemas/error.json" }
    Error:
      description: 统一错误格式
      content:
        application/json:
          schema: { $ref: "../schemas/error.json" }
  schemas:
    Me:
      type: object
      required: [tenant_id, user_id]
      properties:
        tenant_id: { type: string }
        user_id: { type: string }
        display_name:
          type: string
          description: 姓名、用户名、用户 ID 依次回退；v1 保持字符串保证，可缺省。
        roles: { type: array, items: { type: string } }
    ObjectTypeRef:
      type: object
      required: [type_uri, name, version, attributes]
      properties:
        type_uri: { type: string, example: "urn:ctx:object:quality:Equipment" }
        name: { type: string }
        display_name: { type: string }
        version: { type: string }
        attributes:
          type: array
          items:
            type: object
            required: [name, data_type]
            properties:
              name: { type: string }
              data_type: { type: string }
              required: { type: boolean }
              data_level: { type: integer }
    ObjectInstance:
      type: object
      required: [object_uri, type_uri, attributes]
      properties:
        object_uri:
          { type: string, example: "urn:ctx:obj:local:Equipment:CNC-07" }
        type_uri: { type: string }
        attributes: { type: object, additionalProperties: true }
        source: { type: string }
    ObjectListView:
      type: object
      required: [object_type, items]
      properties:
        object_type: { $ref: "#/components/schemas/ObjectTypeRef" }
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/ObjectInstance" },
          }
        trace_id: { type: string, description: 用于查询本次取数的审计记录 }
    # ---------- 005 ----------
    ServiceType: { type: string, enum: [Mysql, Postgres, Oracle, Mssql, Doris] }
    PipelineState:
      {
        type: string,
        enum: [queued, running, success, partialSuccess, failed, stopped],
      }
    ConnectionInput:
      type: object
      description: 按连接器映射到 OM 原生连接字段（research R9）；高级字段不暴露
      required: [hostPort, username, password]
      properties:
        hostPort:
          { type: string, minLength: 1, example: "mes.mock-sources.svc:3306" }
        username: { type: string, minLength: 1 }
        password:
          {
            type: string,
            minLength: 1,
            writeOnly: true,
            description: '"*********" 表示保留已保存的密码',
          }
        database:
          type: [string, "null"]
          description: MySQL / Doris 选填（databaseSchema）；PostgreSQL / SQL Server 必填（database）；Oracle 为 Service Name
        tls: { type: boolean, default: false }
    ConnectionView:
      type: object
      required: [hostPort, username, password]
      properties:
        hostPort: { type: string }
        username: { type: string }
        password: { type: string, const: "*********" }
        database: { type: [string, "null"] }
        tls: { type: boolean }
    FilterPattern:
      type: object
      properties:
        includes:
          {
            type: array,
            items: { type: string },
            description: 正则；空数组表示不限,
          }
        excludes: { type: array, items: { type: string } }
    Scope:
      type: object
      properties:
        databaseFilterPattern:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/FilterPattern" },
                { type: "null" },
              ],
          }
        schemaFilterPattern:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/FilterPattern" },
                { type: "null" },
              ],
          }
        tableFilterPattern:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/FilterPattern" },
                { type: "null" },
              ],
          }
        includeViews: { type: boolean, default: true }
    Schedule:
      type: object
      description: cron 为空表示仅手动触发；时区固定 Asia/Shanghai
      properties:
        cron: { type: [string, "null"], example: "0 2 * * *" }
    SourceUpsert:
      type: object
      required:
        [name, displayName, serviceType, connection, scope, metadataSchedule]
      properties:
        name:
          {
            type: string,
            pattern: "^[a-z][a-z0-9-]{1,49}$",
            description: "test-connection 为保留名（400 source.invalid_request）",
          }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        serviceType: { $ref: "#/components/schemas/ServiceType" }
        connection: { $ref: "#/components/schemas/ConnectionInput" }
        scope: { $ref: "#/components/schemas/Scope" }
        metadataSchedule: { $ref: "#/components/schemas/Schedule" }
        createLineageTask:
          {
            type: boolean,
            default: false,
            description: 仅在 includeViews=true 时允许为 true,
          }
        lineageSchedule:
          {
            oneOf:
              [{ $ref: "#/components/schemas/Schedule" }, { type: "null" }],
          }
    PipelineSummary:
      type: object
      required: [kind, name, fullyQualifiedName, deployed, scheduleEnabled]
      properties:
        kind: { type: string, enum: [metadata, lineage] }
        name:
          {
            type: string,
            description: "<服务>_<kind>_<8 位随机串>（research R8）",
          }
        fullyQualifiedName: { type: string }
        deployed: { type: boolean }
        schedule: { $ref: "#/components/schemas/Schedule" }
        scheduleEnabled: { type: boolean }
        lastRun:
          {
            oneOf:
              [{ $ref: "#/components/schemas/PipelineRun" }, { type: "null" }],
          }
    PipelineRun:
      type: object
      description: OM PipelineStatus 的投影；不含触发方式
      required: [runId, pipelineState]
      properties:
        runId: { type: string, format: uuid }
        pipelineState: { $ref: "#/components/schemas/PipelineState" }
        startDate: { type: [integer, "null"], description: 毫秒时间戳 }
        endDate: { type: [integer, "null"] }
        steps:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                {
                  type: string,
                  description: Source 步骤为连接器类型，Sink 为 OpenMetadata,
                }
              records: { type: integer }
              updatedRecords: { type: integer }
              warnings: { type: integer }
              errors: { type: integer }
              filtered: { type: integer }
              failures:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    error: { type: string }
    SourceSummary:
      type: object
      required:
        [
          name,
          displayName,
          serviceType,
          configured,
          tableCount,
          columnCount,
          pipelines,
        ]
      properties:
        name: { type: string }
        displayName: { type: string }
        serviceType: { $ref: "#/components/schemas/ServiceType" }
        database: { type: [string, "null"] }
        configured: { type: boolean, description: 已创建元数据采集任务 }
        tableCount:
          { type: integer, description: OM 中该服务下的表与视图数（含 View） }
        columnCount: { type: integer }
        pipelines:
          {
            type: array,
            items: { $ref: "#/components/schemas/PipelineSummary" },
          }
    SourceDetail:
      allOf:
        - $ref: "#/components/schemas/SourceSummary"
        - type: object
          required: [connection, scope]
          properties:
            description: { type: string }
            connection: { $ref: "#/components/schemas/ConnectionView" }
            scope: { $ref: "#/components/schemas/Scope" }
            governance: { $ref: "#/components/schemas/GovernanceValues" }
    TestConnectionResult:
      type: object
      required: [workflowId, status, steps]
      properties:
        workflowId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum: [Pending, Running, Successful, Failed],
            description: 映射 OM workflow 状态,
          }
        steps:
          type: array
          description: 以 OM testConnections/database/<connector>.json 的步骤为准
          items:
            type: object
            required: [name, mandatory, passed]
            properties:
              name: { type: string, example: CheckAccess }
              mandatory: { type: boolean }
              passed: { type: [boolean, "null"], description: null 表示未执行 }
              message: { type: [string, "null"] }
    GovernanceValues:
      type: object
      properties:
        displayName: { type: [string, "null"] }
        description: { type: [string, "null"] }
        owners: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        domains: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        tier: { type: [string, "null"], example: Tier.Tier2 }
        tags: { type: array, items: { type: string } }
        glossaryTerms: { type: array, items: { type: string } }
        dataProducts:
          { type: array, items: { $ref: "#/components/schemas/Ref" } }
        retentionPeriod: { type: [string, "null"], example: P30D }
        inheritedFrom:
          type: object
          description: 字段名 → 继承来源 {entityType, fullyQualifiedName}；未列出表示单独设置或为空
          additionalProperties:
            type: object
            properties:
              entityType: { type: string }
              fullyQualifiedName: { type: string }
    GovernancePatch:
      type: object
      description: 只含要改的字段；值为 null 表示清空（恢复继承）
      properties:
        columnName:
          {
            type: string,
            minLength: 1,
            description: 编辑字段属性时提供；仅允许 displayName / description / tags / glossaryTerms,
          }
        displayName: { type: [string, "null"] }
        description: { type: [string, "null"] }
        owners:
          { type: [array, "null"], items: { $ref: "#/components/schemas/Ref" } }
        domain:
          { oneOf: [{ $ref: "#/components/schemas/Ref" }, { type: "null" }] }
        tier: { type: [string, "null"] }
        tags: { type: [array, "null"], items: { type: string } }
        glossaryTerms: { type: [array, "null"], items: { type: string } }
        dataProducts:
          { type: [array, "null"], items: { $ref: "#/components/schemas/Ref" } }
        retentionPeriod: { type: [string, "null"] }
    CatalogEntity:
      type: object
      required: [entityType, name, fullyQualifiedName]
      properties:
        entityType:
          {
            type: string,
            enum: [databaseService, database, databaseSchema, table],
          }
        id: { type: string, format: uuid }
        name: { type: string }
        fullyQualifiedName: { type: string }
        governance: { $ref: "#/components/schemas/GovernanceValues" }
        children:
          type: array
          description: 直接子项（库 / Schema / 表）及其计数
          items:
            type: object
            properties:
              entityType: { type: string }
              name: { type: string }
              fullyQualifiedName: { type: string }
              displayName: { type: [string, "null"] }
              description: { type: [string, "null"] }
              childCount: { type: integer }
        table:
          type: object
          description: 仅 entityType=table
          properties:
            tableType: { type: string, example: Regular }
            constraints:
              type: array
              items:
                type: object
                properties:
                  constraintType: { type: string, example: PRIMARY_KEY }
                  columns: { type: array, items: { type: string } }
            schemaDefinition: { type: [string, "null"] }
            columns:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  dataTypeDisplay: { type: string }
                  constraint:
                    {
                      type: [string, "null"],
                      description: OM 列级约束，如 PRIMARY_KEY,
                    }
                  displayName: { type: [string, "null"] }
                  description: { type: [string, "null"] }
                  tags: { type: array, items: { type: string } }
                  glossaryTerms: { type: array, items: { type: string } }
    Ref:
      type: object
      required: [id, type]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, minLength: 1, example: user }
        name: { type: string }
        displayName: { type: string }
        fullyQualifiedName: { type: string }
    GovernanceOptions:
      type: object
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        teams: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        domains: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        dataProducts:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Ref"
              - type: object
                properties:
                  domains:
                    { type: array, items: { $ref: "#/components/schemas/Ref" } }
        classifications:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              mutuallyExclusive: { type: boolean }
              tags: { type: array, items: { type: string } }
        glossaryTerms: { type: array, items: { type: string } }
    # ---------- 006 资产搜索与摘要 ----------
    EntityType:
      type: string
      description: OM dataAsset 别名覆盖的实体类型（indexMapping.json）；BFF 以白名单校验
      enum:
        [
          table,
          tableColumn,
          storedProcedure,
          databaseSchema,
          database,
          chart,
          dashboard,
          dashboardDataModel,
          pipeline,
          topic,
          container,
          directory,
          file,
          spreadsheet,
          worksheet,
          searchIndex,
          mlmodel,
          dataProduct,
          metric,
          glossaryTerm,
          tag,
          apiCollection,
          apiEndpoint,
          page,
        ]
      x-source: indexMapping.json 中 parentAliases 含 dataAsset 的 24 类实体（OM 2.0.3，b76076bf），已逐项核对
    FacetDimension:
      type: string
      enum:
        [
          entityType,
          domain,
          dataProduct,
          owner,
          tag,
          tier,
          service,
          serviceType,
          certification,
          database,
          databaseSchema,
          column,
          tableType,
          columnDescriptionStatus,
        ]
      description: 最后 5 项只能在 entityType=table 时使用；字段映射见 research R4
    BrowseStep:
      type: object
      required: [level, value]
      additionalProperties: false
      properties:
        level:
          {
            type: string,
            enum:
              [
                root,
                serviceType,
                service,
                database,
                databaseSchema,
                entityType,
              ],
          }
        value: { type: string, minLength: 1, maxLength: 256 }
        label: { type: string, description: 只用于在条件条上显示；BFF 不使用 }
    SearchCriteria:
      type: object
      additionalProperties: false
      properties:
        keyword: { type: string, maxLength: 200, default: "" }
        scope:
          {
            oneOf:
              [{ $ref: "#/components/schemas/EntityType" }, { type: "null" }],
          }
        entityType:
          {
            oneOf:
              [{ $ref: "#/components/schemas/EntityType" }, { type: "null" }],
          }
        browsePath:
          {
            type: array,
            maxItems: 6,
            items: { $ref: "#/components/schemas/BrowseStep" },
            default: [],
          }
        filters:
          type: object
          propertyNames: { $ref: "#/components/schemas/FacetDimension" }
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              values:
                {
                  type: array,
                  maxItems: 50,
                  items: { type: string, minLength: 1, maxLength: 256 },
                }
              includeNone:
                {
                  type: boolean,
                  default: false,
                  description: 只用于 owner / domain / tier / tag / certification,
                }
          default: {}
        sort:
          type: object
          additionalProperties: false
          properties:
            field:
              {
                type: string,
                enum: [popularity, name, relevance, updatedAt],
                default: popularity,
              }
            order: { type: string, enum: [asc, desc], default: desc }
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, enum: [15, 25, 50], default: 15 }
    AssetRef:
      type: object
      required: [entityType, id, fqn]
      properties:
        entityType: { $ref: "#/components/schemas/EntityType" }
        id: { type: string }
        fqn: { type: string }
    TextSegment:
      type: object
      required: [text, match]
      properties:
        text: { type: string }
        match:
          {
            type: boolean,
            description: 是否为命中词；由 OM highlight 解析得到，不返回 HTML,
          }
    GovernanceSummary:
      type: object
      properties:
        owners: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        domains: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        dataProducts:
          { type: array, items: { $ref: "#/components/schemas/Ref" } }
        tier:
          {
            type: [string, "null"],
            description: "Tier.* 标签 FQN；显示为「分级（Tier）」",
          }
        dataLevel:
          {
            type: [string, "null"],
            description: 分类「数据级别」下的标签 FQN（ADR-0008）,
          }
        certification:
          { type: [string, "null"], description: certification.tagLabel.tagFQN }
        glossaryTerms: { type: array, items: { type: string } }
        tags:
          {
            type: array,
            items: { type: string },
            description: 不含 Tier、数据级别、术语与开发态标识,
          }
        origin:
          {
            type: string,
            enum: [collected, devTest],
            description: 带开发态标识标签的为 devTest（research R12）,
          }
    SearchHit:
      type: object
      required: [ref, name, origin]
      properties:
        ref: { $ref: "#/components/schemas/AssetRef" }
        name: { type: string }
        displayName: { type: [string, "null"] }
        serviceType: { type: [string, "null"] }
        breadcrumb:
          type: array
          description: 服务 / 库 / Schema 的位置（显示名，原始 FQN 见 ref.fqn）
          items:
            {
              type: object,
              properties:
                { entityType: { type: string }, label: { type: string } },
            }
        nameHighlight:
          { type: array, items: { $ref: "#/components/schemas/TextSegment" } }
        descriptionHighlight:
          { type: array, items: { $ref: "#/components/schemas/TextSegment" } }
        description: { type: [string, "null"] }
        governance: { $ref: "#/components/schemas/GovernanceSummary" }
        origin: { type: string, enum: [collected, devTest] }
        matchedFields:
          type: array
          items:
            {
              type: object,
              required: [field, count],
              properties: { field: { type: string }, count: { type: integer } },
            }
        parentTable:
          {
            oneOf:
              [{ $ref: "#/components/schemas/AssetRef" }, { type: "null" }],
            description: 仅 tableColumn,
          }
        columnName: { type: [string, "null"], description: 仅 tableColumn }
    SearchPage:
      type: object
      required: [total, page, pageSize, hits, windowLimited]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer }
        pageSize: { type: integer }
        windowLimited:
          { type: boolean, description: total 超过 10000，只能翻到前 10000 条 }
        index: { type: string, description: 实际查询的 OM 索引别名，便于核对 }
        hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
    TypeCounts:
      type: object
      required: [counts]
      properties:
        counts:
          type: array
          items:
            {
              type: object,
              required: [entityType, count],
              properties:
                {
                  entityType: { $ref: "#/components/schemas/EntityType" },
                  count: { type: integer, minimum: 1 },
                },
            }
        topHitType:
          {
            oneOf:
              [{ $ref: "#/components/schemas/EntityType" }, { type: "null" }],
          }
        defaultType:
          oneOf: [{ $ref: "#/components/schemas/EntityType" }, { type: "null" }]
          description: topHitType 的计数大于 0 时取它，否则取计数最多的类型（FR-007）
    FacetOption:
      type: object
      required: [value, count]
      properties:
        value: { type: string, description: OM 桶键，作为筛选取值回传 }
        label:
          {
            type: string,
            description: 原始大小写的显示名（top_hits），没有时等于 value,
          }
        count: { type: integer, minimum: 0 }
    BrowseNode:
      type: object
      required: [level, value, label, count, hasChildren]
      properties:
        level:
          {
            type: string,
            enum:
              [
                root,
                serviceType,
                service,
                database,
                databaseSchema,
                entityType,
              ],
          }
        value: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 0 }
        hasChildren: { type: boolean }
    Suggestion:
      type: object
      required: [ref, label]
      properties:
        ref: { $ref: "#/components/schemas/AssetRef" }
        label: { type: string, description: displayName，没有时为 name }
        location: { type: string, description: 位置（完整 FQN） }
        parentTable:
          {
            oneOf:
              [{ $ref: "#/components/schemas/AssetRef" }, { type: "null" }],
          }
        columnName: { type: [string, "null"] }
    SummaryColumn:
      type: object
      required: [name]
      properties:
        name: { type: string }
        dataTypeDisplay: { type: [string, "null"] }
        constraint:
          {
            type: [string, "null"],
            description: PRIMARY_KEY / UNIQUE 等，取自列约束与表约束,
          }
        description: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        tags:
          { type: array, items: { type: string }, description: 含数据级别标签 }
        dataLevel: { type: [string, "null"] }
    AssetSummary:
      type: object
      required: [ref, name, governance]
      properties:
        ref: { $ref: "#/components/schemas/AssetRef" }
        name: { type: string }
        displayName: { type: [string, "null"] }
        description: { type: [string, "null"] }
        breadcrumb:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  { entityType: { type: string }, label: { type: string } },
              },
          }
        governance: { $ref: "#/components/schemas/GovernanceSummary" }
        columns:
          {
            type: array,
            items: { $ref: "#/components/schemas/SummaryColumn" },
            description: 仅 table,
          }
        column:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/SummaryColumn" },
                { type: "null" },
              ],
            description: 仅 tableColumn,
          }
        parentTable:
          {
            oneOf:
              [{ $ref: "#/components/schemas/AssetRef" }, { type: "null" }],
            description: 仅 tableColumn,
          }
    GlossaryTermDetail:
      type: object
      description: 字段清单见 research R9（负责人 2026-11-09 确认）；只读，无编辑字段
      required: [ref, name]
      properties:
        ref: { $ref: "#/components/schemas/AssetRef" }
        name: { type: string }
        displayName: { type: [string, "null"] }
        description: { type: [string, "null"] }
        glossary: { $ref: "#/components/schemas/Ref" }
        parent:
          { oneOf: [{ $ref: "#/components/schemas/Ref" }, { type: "null" }] }
        synonyms: { type: array, items: { type: string } }
        relatedTerms:
          { type: array, items: { $ref: "#/components/schemas/Ref" } }
        references:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  { name: { type: string }, endpoint: { type: string } },
              },
          }
        owners: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        reviewers: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        domains: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        tags: { type: array, items: { type: string } }
        entityStatus: { type: [string, "null"] }
        origin: { type: string, enum: [collected, devTest] }
    TagDetail:
      type: object
      description: 字段清单见 research R9（负责人 2026-11-09 确认）；只读，无编辑字段
      required: [ref, name]
      properties:
        ref: { $ref: "#/components/schemas/AssetRef" }
        name: { type: string }
        displayName: { type: [string, "null"] }
        description: { type: [string, "null"] }
        classification: { $ref: "#/components/schemas/Ref" }
        parent:
          { oneOf: [{ $ref: "#/components/schemas/Ref" }, { type: "null" }] }
        owners: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        reviewers: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        domains: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        deprecated: { type: boolean }
