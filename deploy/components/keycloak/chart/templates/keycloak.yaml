{{- if .Values.keycloak.enabled }}
# 自带 Keycloak（客户没有 Keycloak 时）：官方镜像，数据库为平台 PostgreSQL 中的独立 database
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak-admin
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  username: admin
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-keycloak-admin" .Release.Name) }}
  password: {{ if $existing }}{{ index $existing.data "password" | b64dec }}{{ else }}{{ randAlphaNum 24 }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: contexture }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: contexture }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: [start, --http-enabled=true, --proxy-headers=xforwarded, --health-enabled=true]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://{{ .Values.keycloak.databaseHost }}:5432/{{ .Values.keycloak.database }}" }
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: pg-{{ .Values.keycloak.database }}, key: username } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-{{ .Values.keycloak.database }}, key: password } }
            - { name: KC_HOSTNAME, value: {{ required "keycloak.hostname 必填" .Values.keycloak.hostname | quote }} }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-keycloak-admin, key: password } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /health/started, port: management }
            failureThreshold: 60
            periodSeconds: 5
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
