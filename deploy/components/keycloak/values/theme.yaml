      \      ? copy.accountStep\n        : password && !username\n          ? copy.passwordStep\n\
      \          : copy.identityDescription,\n    );\n    username?.setAttribute(\"\
      placeholder\", copy.accountPlaceholder);\n    password?.setAttribute(\"placeholder\"\
