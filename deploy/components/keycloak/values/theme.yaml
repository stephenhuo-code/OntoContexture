      identityNote\": \"由企业身份服务验证账号。\"};\n/* global document, window */\n// 渐进增强官方主题：只装配品牌布局，原生表单节点与身份服务脚本完整保留。\n\
      (() => {\n  function start() {\n    const copy = window.CONTEXTURE_LOGIN_COPY;\n\
