      \ 1fr) 370px;\n  gap: 70px;\n  align-items: center;\n}\n.oc-intro {\n  max-width:\
      \ 640px;\n  padding-bottom: 32px;\n}\n.oc-eyebrow {\n  color: #2c65ab;\n  font-size:\
