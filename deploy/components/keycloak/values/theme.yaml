    resources/identity/identity.css: "/* 共享身份页视觉：Web 与 Keycloak 官方主题使用同一资源。 */\n.oc-identity\
      \ {\n  --oc-blue: #0753e5;\n  --oc-ink: #101c30;\n  --oc-muted: #73839a;\n \
      \ --oc-font: \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n\
      \  color: var(--oc-ink);\n  font: 14px/1.7 var(--oc-font);\n  background: #fff;\n\
      \  min-height: 100dvh;\n  display: flex;\n  flex-direction: column;\n}\n.oc-identity\
      \ *,\n.oc-help-dialog * {\n  box-sizing: border-box;\n}\n.oc-identity button,\n\
      .oc-identity input {\n  font: inherit;\n}\n.oc-identity button:focus-visible,\n\
      .oc-identity a:focus-visible {\n  outline: 3px solid #8db6ff;\n  outline-offset:\
      \ 4px;\n}\n.oc-identity .oc-header {\n  height: 70px;\n  padding: 0 max(4.2vw,\
      \ 28px);\n  display: flex;\n  justify-content: space-between;\n  align-items:\
      \ center;\n  flex-shrink: 0;\n}\n.oc-brand {\n  display: flex;\n  gap: 11px;\n\
      \  align-items: center;\n}\n.oc-mark {\n  width: 33px;\n  height: 33px;\n  background:\
      \ url(\"brand.svg\") center/contain no-repeat;\n}\n.oc-name {\n  font-size:\
      \ 21px;\n  font-weight: 650;\n  letter-spacing: 2px;\n}\n.oc-en {\n  font-size:\
      \ 11px;\n  color: #728099;\n  letter-spacing: 0.5px;\n  margin-left: 8px;\n\
      }\n.oc-language {\n  font-size: 11px;\n  color: #6e7f99;\n  letter-spacing:\
      \ 0.5px;\n}\n.oc-identity .oc-hero {\n  position: relative;\n  isolation: isolate;\n\
      \  flex: 1;\n  min-height: 530px;\n  max-width: none;\n  width: 100%;\n  margin:\
      \ 0;\n  padding: 28px 0;\n  display: flex;\n  align-items: center;\n  overflow:\
      \ hidden;\n  background: linear-gradient(105deg, #e6f1ff, #d9e9ff 46%, #c7ddff);\n\
      }\n.oc-hero::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n\
      \  z-index: -1;\n  background: url(\"hero.svg\") center/cover no-repeat;\n \
      \ pointer-events: none;\n}\n.oc-hero-inner {\n  width: min(1248px, calc(100%\
