      .oc-principles span + span::before {\n  content: \"·\";\n  color: #97b4dd;\n\
      \  margin-right: 11px;\n}\n.oc-intro::after {\n  content: \"\";\n  display:\
      \ block;\n  width: 34px;\n  height: 2px;\n  background: #2366de;\n  margin-top:\
      \ 31px;\n}\n.oc-card {\n  min-width: 0;\n  background: #ffffffed;\n  border:\
