    resources/css/contexture.css: "/* 保留 Keycloak 原生表单、错误消息、密码显隐、其他认证方式与会话检查脚本。 */\n\
      html,\nbody {\n  margin: 0;\n  min-height: 100%;\n  background: white;\n}\n\
      body {\n  font-family: \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n\
      }\n/* 渐进增强失败时，原生表单仍可显示和提交。 */\nbody > .login-pf-page {\n  max-width: 420px;\n\
      \  margin: 12vh auto;\n  padding: 24px;\n}\n.oc-identity--auth .card-pf {\n\
      \  padding: 0;\n  margin: 0;\n  border: 0;\n  background: none;\n  box-shadow:\
      \ none;\n  width: auto;\n}\n.oc-identity--auth #kc-page-title {\n  display:\
      \ none;\n}\n.oc-auth-heading {\n  color: #748cac;\n  font-size: 10px;\n  margin-bottom:\
      \ 7px;\n}\n.oc-identity--auth .oc-title {\n  font-size: 22px;\n}\n.oc-identity--auth\
      \ .oc-card-description {\n  margin-bottom: 20px;\n}\n.oc-kc-field {\n  margin:\
      \ 0 0 15px;\n}\n.oc-kc-label {\n  display: block;\n  font-size: 11px;\n  font-weight:\
      \ 500;\n  margin-bottom: 6px;\n}\n.oc-kc-input {\n  box-sizing: border-box;\n\
      \  width: 100%;\n  height: 41px;\n  padding: 0 12px;\n  border: 1px solid #d7e3f3;\n\
      \  border-radius: 4px;\n  font:\n    12px/1.7 \"PingFang SC\",\n    \"Microsoft\
      \ YaHei\",\n    system-ui,\n    sans-serif;\n  background: white;\n  color:\
      \ #101c30;\n}\n.oc-kc-input:focus-visible {\n  outline: 0;\n  border-color:\
      \ #0753e5;\n  box-shadow: 0 0 0 3px #0753e512;\n}\n.oc-kc-input-group {\n  position:\
      \ relative;\n}\n.oc-kc-input-group input {\n  padding-right: 42px;\n}\n.oc-kc-password-toggle\
      \ {\n  position: absolute;\n  right: 6px;\n  top: 5px;\n  width: 30px;\n  height:\
      \ 30px;\n  border: 0;\n  background: transparent;\n  border-radius: 3px;\n \
      \ cursor: pointer;\n  display: grid;\n  place-items: center;\n}\n.oc-kc-password-toggle\
      \ i {\n  display: block;\n  width: 16px;\n  height: 16px;\n  background: url(\"\
      ../identity/eye.svg\") center/contain no-repeat;\n}\n.oc-kc-password-toggle\
      \ i.oc-eye-hide {\n  background-image: url(\"../identity/eye-hide.svg\");\n\
      }\n.oc-kc-settings {\n  display: flex;\n  justify-content: space-between;\n\
      \  font-size: 11px;\n}\n.oc-kc-settings:empty {\n  display: none;\n}\n#kc-form-options:empty\
      \ {\n  display: none;\n}\n#kc-login {\n  box-sizing: border-box;\n  width: 100%;\n\
      \  min-height: 43px;\n  padding: 10px 14px;\n  background: #0753e5;\n  border:\
      \ 1px solid #0753e5;\n  border-radius: 4px;\n  color: white;\n  font:\n    550\
      \ 12px/1.7 \"PingFang SC\",\n    \"Microsoft YaHei\",\n    system-ui,\n    sans-serif;\n\
      \  cursor: pointer;\n}\n#kc-login:hover:not(:disabled) {\n  background: #0044c4;\n\
      }\n#kc-login:disabled {\n  opacity: 0.7;\n  cursor: wait;\n}\n.oc-kc-error,\n\
      .alert-error {\n  display: block;\n  color: #b34a42;\n  font-size: 11px;\n \
      \ line-height: 1.8;\n  border: 1px solid #f0d9d4;\n  background: #fff6f3;\n\
      \  border-radius: 4px;\n  padding: 8px 10px;\n  margin: 9px 0 14px;\n}\n.alert-warning,\n\
      .alert-info,\n.alert-success {\n  color: #426489;\n  background: #edf5ff;\n\
      \  font-size: 11px;\n  padding: 9px 12px;\n  border-radius: 4px;\n  margin:\
      \ 10px 0 16px;\n}\n#kc-username {\n  display: flex;\n  align-items: center;\n\
      \  flex-wrap: wrap;\n  gap: 12px;\n  font-size: 12px;\n  margin-bottom: 16px;\n\
      \  overflow-wrap: anywhere;\n}\n#reset-login::after {\n  content: \"切换账号\";\n\
      \  font-size: 10px;\n}\n#reset-login .kc-tooltip-text {\n  display: none;\n\
      }\n#kc-info,\n#kc-social-providers,\n#try-another-way {\n  font-size: 11px;\n\
      }\n.oc-identity a {\n  color: #2262c2;\n}\n.oc-help-dialog {\n  margin: 0;\n\
      }\n.oc-help-dialog::backdrop {\n  background: #2b589533;\n  backdrop-filter:\
      \ blur(4px);\n}\n"
