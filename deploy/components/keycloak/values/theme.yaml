      \ {\n  text-decoration: underline;\n}\n.oc-features {\n  background: white;\n\
      \  padding: 35px 0 31px;\n  flex-shrink: 0;\n}\n.oc-features-inner {\n  width:\
      \ min(1248px, calc(100% - 120px));\n  margin: auto;\n  display: grid;\n  grid-template-columns:\
      \ repeat(3, minmax(0, 1fr));\n  gap: 62px;\n}\n.oc-feature {\n  display: grid;\n\
      \  grid-template-columns: 50px 1fr;\n  gap: 16px;\n}\n.oc-feature-icon {\n \
      \ width: 48px;\n  height: 53px;\n  background: center/contain no-repeat;\n}\n\
      .oc-feature-icon--data {\n  background-image: url(\"data.svg\");\n}\n.oc-feature-icon--semantics\
      \ {\n  background-image: url(\"semantics.svg\");\n}\n.oc-feature-icon--trust\
      \ {\n  background-image: url(\"trust.svg\");\n}\n.oc-identity .oc-feature h3\
      \ {\n  font-size: 15px;\n  line-height: 1.6;\n  font-weight: 600;\n  letter-spacing:\
      \ 0.2px;\n  margin: 4px 0 8px;\n}\n.oc-feature p {\n  font-size: 11px;\n  line-height:\
      \ 1.95;\n  color: #78869a;\n  margin: 0;\n  max-width: 285px;\n}\n.oc-footer\
      \ {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n\
      \  gap: 18px;\n  margin: auto max(4.2vw, 28px) 0;\n  padding: 14px 0 15px;\n\
      \  border-top: 1px solid #f0f3f8;\n  color: #9aa6b8;\n  font-size: 10px;\n \
      \ flex-shrink: 0;\n}\n.oc-help-overlay {\n  position: fixed;\n  inset: 0;\n\
      \  background: #2b589533;\n  backdrop-filter: blur(4px);\n  z-index: 200;\n\
      }\n.oc-help-dialog {\n  position: fixed;\n  left: 50%;\n  top: 50%;\n  transform:\
      \ translate(-50%, -50%);\n  background: white;\n  color: #101c30;\n  font:\n\
