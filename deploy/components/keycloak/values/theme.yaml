      \ class=\"oc-footer\"><span></span><span></span></footer>`;\n    const put =\
      \ (selector, text) => {\n      root.querySelector(selector).textContent = text;\n\
      \    };\n    put(\".oc-name\", copy.brand);\n    put(\".oc-en\", copy.name);\n\
