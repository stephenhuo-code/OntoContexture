apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway
data:
  config.yaml: {{ required "config 未注入" .Values.config | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels: { app.kubernetes.io/name: ai-gateway, app.kubernetes.io/part-of: contexture }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ai-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ai-gateway, app.kubernetes.io/part-of: contexture }
      annotations:
        checksum/config: {{ .Values.config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agentgateway
          image: {{ .Values.image }}
          args: [-f, /config/config.yaml]
          env:
            - { name: CTX_TENANT_ID, value: {{ .Values.tenantId | quote }} }
            - { name: KEYCLOAK_ISSUER, value: {{ .Values.keycloakIssuer | quote }} }
            - { name: TOOLBOX_MCP_URL, value: {{ .Values.toolboxMcpUrl | quote }} }
            - { name: OTEL_COLLECTOR_GRPC, value: {{ .Values.otelCollectorGrpc | quote }} }
            - name: MODEL_HOST
              valueFrom: { secretKeyRef: { name: {{ .Values.modelSecret }}, key: host } }
            - name: MODEL_NAME
              valueFrom: { secretKeyRef: { name: {{ .Values.modelSecret }}, key: model } }
            - name: MODEL_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.modelSecret }}, key: api-key } }
            {{- if .Values.trustedCaSecret }}
            - { name: SSL_CERT_FILE, value: /etc/contexture/ca/ca.crt }
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: ready, containerPort: 15021 }
            - { name: metrics, containerPort: 15020 }
          readinessProbe:
            httpGet: { path: /healthz/ready, port: ready }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            {{- if .Values.trustedCaSecret }}
            - { name: trusted-ca, mountPath: /etc/contexture/ca, readOnly: true }
            {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: ai-gateway }
        {{- if .Values.trustedCaSecret }}
        - name: trusted-ca
          secret: { secretName: {{ .Values.trustedCaSecret }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
spec:
  selector: { app.kubernetes.io/name: ai-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# 网关自带的 Prometheus 指标（不经入口暴露）
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-metrics
spec:
  selector: { app.kubernetes.io/name: ai-gateway }
  ports:
    - { name: metrics, port: 15020, targetPort: metrics }
{{- if .Values.route.enabled }}
---
# 入口路由：/mcp 与 /v1 → AI 网关（供外部 Agent 平台与客户端使用，T054）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp }
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        - name: ai-gateway
          port: 8080
{{- end }}
