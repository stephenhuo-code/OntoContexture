apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fuseki
  labels: { app.kubernetes.io/name: fuseki, app.kubernetes.io/part-of: contexture }
spec:
  serviceName: fuseki
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: fuseki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fuseki, app.kubernetes.io/part-of: contexture }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1000 }
      containers:
        - name: fuseki
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: JVM_ARGS, value: {{ .Values.jvmArgs | quote }} }
            - name: FUSEKI_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.authSecret }}, key: admin-password } }
            - name: FUSEKI_OPENMETADATA_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.authSecret }}, key: openmetadata-password } }
          ports:
            - { name: http, containerPort: 3030 }
          readinessProbe:
            httpGet: { path: /$/ping, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /fuseki-data }
          resources: {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: fuseki
spec:
  selector: { app.kubernetes.io/name: fuseki }
  ports:
    - { name: http, port: 3030, targetPort: http }
