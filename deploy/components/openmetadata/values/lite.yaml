# 精简：与 local 共用本机 Keycloak OIDC 配置，调小 JVM 堆与容器内存请求
openmetadata:
  config:
    authentication:
      authority: https://sso.127.0.0.1.nip.io/realms/digital-workforce
      publicKeys:
        - http://openmetadata:8585/api/v1/system/config/jwks
        - https://sso.127.0.0.1.nip.io/realms/digital-workforce/protocol/openid-connect/certs
      callbackUrl: http://localhost:8585/callback
      oidcConfiguration:
        discoveryUri: https://sso.127.0.0.1.nip.io/realms/digital-workforce/.well-known/openid-configuration
        callbackUrl: http://localhost:8585/callback
        serverUrl: http://localhost:8585

extraEnvs:
  - { name: OPENMETADATA_HEAP_OPTS, value: "-Xmx768m -Xms768m" }
  - {
      name: OPENMETADATA_OPTS,
      value: "-Djavax.net.ssl.trustStore=/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit",
    }
resources:
  requests: { cpu: 200m, memory: 1Gi }
  limits: { memory: 1536Mi }
