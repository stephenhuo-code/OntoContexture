{{- $servers := dict "staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "production" "https://acme-v02.api.letsencrypt.org/directory" }}
{{- range $name, $server := $servers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-{{ $name }}
spec:
  acme:
    server: {{ $server }}
    email: {{ required "acmeEmail 必填" $.Values.acmeEmail | quote }}
    privateKeySecretRef: { name: letsencrypt-{{ $name }}-account }
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ $.Values.gateway.name }}
                namespace: {{ $.Values.gateway.namespace }}
                sectionName: {{ $.Values.gateway.listener }}
                kind: Gateway
            {{- with $.Values.nodeSelector }}
            podTemplate:
              spec:
                nodeSelector: {{- toYaml . | nindent 18 }}
            {{- end }}
{{- end }}
---
# 一张证书覆盖基础域名与全部子域名（R4）；Gateway 的 https 监听器引用该 Secret
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: contexture
  namespace: {{ .Values.gateway.namespace }}
spec:
  secretName: {{ .Values.secretName }}
  issuerRef: { kind: ClusterIssuer, name: letsencrypt-{{ .Values.acmeServer }} }
  renewBefore: 720h
  dnsNames:
    - {{ required "domain 必填" .Values.domain | quote }}
{{- range .Values.subdomains }}
    - {{ printf "%s.%s" . $.Values.domain | quote }}
{{- end }}
