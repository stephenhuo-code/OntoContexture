apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: toolbox-cache
  annotations: { helm.sh/resource-policy: keep }
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.cacheSize }} } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toolbox
{{- range .Values.targetNamespaces }}
---
# 工具箱只在织境的 namespace 内工作（e2e 的 kubectl 操作、port-forward、seed）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: contexture-toolbox
  namespace: {{ . }}
rules:
  - apiGroups: ["", apps, batch]
    # deployments/scale：e2e 场景 F 把 OpenMetadata 缩为 0 再恢复，验证不可用时的真实报错（T068 实测）
    resources: [pods, pods/log, pods/exec, pods/portforward, services, secrets, configmaps, deployments, deployments/scale, statefulsets, jobs]
    verbs: [get, list, watch, create, delete, patch, update]
  # 云端环境检查（tests/cloud/test_cloud_env.py）读取证书状态与续期设置（T068 实测）
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: contexture-toolbox
  namespace: {{ . }}
subjects:
  - { kind: ServiceAccount, name: toolbox, namespace: {{ $.Release.Namespace }} }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: contexture-toolbox }
{{- end }}
