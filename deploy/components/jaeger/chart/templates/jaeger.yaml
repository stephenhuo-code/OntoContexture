apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
    extensions:
      healthcheckv2:
        use_v2: true
        http: { endpoint: 0.0.0.0:13133 }
      jaeger_query:
        storage: { traces: memstore }
        ui: {}
      jaeger_storage:
        backends:
          memstore:
            memory: { max_traces: {{ .Values.maxTraces }} }
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
    processors:
      batch: {}
    exporters:
      jaeger_storage_exporter:
        trace_storage: memstore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: contexture }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: contexture }
      annotations: { checksum/config: {{ .Values | toJson | sha256sum }} }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: {{ .Values.image }}
          args: [--config, /etc/jaeger/config.yaml]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: ui, containerPort: 16686 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet: { path: /status, port: health }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/jaeger }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: jaeger }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: ui, port: 16686, targetPort: ui }
