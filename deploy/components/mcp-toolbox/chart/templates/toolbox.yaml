apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-toolbox
data:
  tools.yaml: {{ required "tools 未注入" .Values.tools | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-toolbox
  labels: { app.kubernetes.io/name: mcp-toolbox, app.kubernetes.io/part-of: contexture }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mcp-toolbox }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mcp-toolbox, app.kubernetes.io/part-of: contexture }
      annotations:
        checksum/tools: {{ .Values.tools | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # Toolbox 启动时连接数据源，失败即退出：先等 Doris FE 的查询端口可用（如集群重启后）
      initContainers:
        - name: wait-doris
          image: {{ .Values.waitImage }}
          command: [sh, -c, "until nc -z -w 2 {{ .Values.doris.host }} 9030; do echo waiting for doris; sleep 3; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: toolbox
          image: {{ .Values.image }}
          args:
            - --config=/config/tools.yaml
            - --address=0.0.0.0
            - --port=5000
            - --disable-version-check
            - --logging-format=JSON
            # 只供集群内服务（经 AI 网关）调用：限定 Host，不接受浏览器跨域
            - --allowed-hosts=mcp-toolbox,mcp-toolbox.{{ .Release.Namespace }},mcp-toolbox.{{ .Release.Namespace }}.svc,mcp-toolbox.{{ .Release.Namespace }}.svc.cluster.local
            - --allowed-origins=http://mcp-toolbox
            {{- if .Values.otlpEndpoint }}
            - --telemetry-otlp={{ .Values.otlpEndpoint }}
            - --telemetry-service-name=mcp-toolbox
            {{- end }}
          env:
            - { name: DORIS_HOST, value: {{ .Values.doris.host | quote }} }
            {{- if .Values.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            {{- end }}
            - { name: DORIS_DATABASE, value: {{ .Values.doris.database | quote }} }
            - name: DORIS_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.doris.secret }}, key: username } }
            - name: DORIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.doris.secret }}, key: password } }
          ports:
            - { name: http, containerPort: 5000 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          securityContext:
            # 镜像用户为 distroless 的 nonroot（非数字），须显式给出 UID
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: mcp-toolbox }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-toolbox
spec:
  selector: { app.kubernetes.io/name: mcp-toolbox }
  ports:
    - { name: http, port: 5000, targetPort: http }
