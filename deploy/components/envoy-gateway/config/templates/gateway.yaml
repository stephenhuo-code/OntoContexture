# 织境入口：一个 Gateway，NodePort 30080 映射到宿主机 8080（deploy/kind/cluster.yaml）
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: contexture
  namespace: envoy-gateway-system
spec:
  # 入口追踪：每个请求生成入口 span 并以 traceparent 传给 bff（链路的第一跳，ADR-0001）
  telemetry:
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        serviceName: contexture-gateway
        backendRefs:
          - name: otel-collector
            namespace: contexture
            port: 4317
      customTags:
        ctx.tenant.id:
          type: Literal
          literal: { value: {{ .Values.tenantId | default "local" }} }
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
{{- if eq (.Values.envoyService).type "LoadBalancer" }}
        # 云端（030）：云负载均衡器；厂商注解来自各环境参数（research R3、R19）
        type: LoadBalancer
        {{- with (.Values.loadBalancer).annotations }}
        annotations: {{- toYaml . | nindent 10 }}
        {{- end }}
{{- else }}
        type: NodePort
        # kind 的宿主机端口映射在控制面节点上，Envoy Pod 可能在其他节点
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: 30080
{{- end }}
      envoyDeployment:
        {{- with .Values.nodeSelector }}
        pod:
          nodeSelector: {{- toYaml . | nindent 12 }}
        {{- end }}
        container:
          # 显式按标签引用（Envoy Gateway 默认以 digest 引用，离线导入的单架构镜像 digest 不同）
          image: docker.io/envoyproxy/envoy:distroless-v1.39.1
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: contexture
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: contexture
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contexture
  namespace: contexture
spec:
  gatewayClassName: contexture
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
{{- with .Values.https }}
{{- if .enabled }}
    # 云端（030）：一张证书覆盖全部主机名（research R4）；业务路由只挂 https，http 只挂 ACME 校验与重定向
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .certificateSecret }}
      allowedRoutes:
        namespaces: { from: Same }
{{- end }}
{{- end }}
{{- if (.Values.https).redirectHttp }}
---
# HTTP → HTTPS（FR-019）：路径更长的 ACME 校验路由优先匹配，不受影响
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: contexture
spec:
  parentRefs:
    - name: contexture
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- range .Values.routes }}
---
# 组件界面按子域名经 HTTPS 访问（030 FR-020）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui-{{ .name }}
  namespace: contexture
spec:
  parentRefs:
    - name: contexture
      sectionName: https
  hostnames: [{{ .host | quote }}]
  rules:
    {{- range .blockPathPrefixes }}
    # 不经入口暴露的路径：重定向到首页，请求不会到达后端
    - matches:
        - path: { type: PathPrefix, value: {{ . | quote }} }
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: { type: ReplaceFullPath, replaceFullPath: / }
            statusCode: 302
    {{- end }}
    - backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
      {{- with .timeout }}
      timeouts:
        request: {{ . }}
      {{- end }}
{{- end }}
