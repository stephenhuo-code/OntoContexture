langfuse:
  features:
    telemetryEnabled: false
  salt:
    secretKeyRef: { name: langfuse-secrets, key: salt }
  encryptionKey:
    secretKeyRef: { name: langfuse-secrets, key: encryption-key }
  nextauth:
    url: http://localhost:3000
    secret:
      secretKeyRef: { name: langfuse-secrets, key: nextauth-secret }
  # 首次启动时创建组织、项目与 API 密钥（OTel Collector 用这对密钥写入轨迹）
  additionalEnv:
    - { name: LANGFUSE_INIT_ORG_ID, value: contexture }
    - { name: LANGFUSE_INIT_ORG_NAME, value: 织境 }
    - { name: LANGFUSE_INIT_PROJECT_ID, value: contexture }
    - { name: LANGFUSE_INIT_PROJECT_NAME, value: 织境 }
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom: { secretKeyRef: { name: langfuse-init, key: public-key } }
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom: { secretKeyRef: { name: langfuse-init, key: secret-key } }
    - { name: LANGFUSE_INIT_USER_EMAIL, value: admin@contexture.local }
    - { name: LANGFUSE_INIT_USER_NAME, value: admin }
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom: { secretKeyRef: { name: langfuse-init, key: admin-password } }
  web:
    image: { tag: "4.63.0", pullPolicy: IfNotPresent }
    # 启动时（迁移与预热）内存峰值较高，1 GiB 会触发 Node 堆溢出
    resources:
      requests: { cpu: 100m, memory: 768Mi }
      limits: { memory: 2Gi }
  worker:
    image: { tag: "4.63.0", pullPolicy: IfNotPresent }
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 768Mi }

# 平台共享的 PostgreSQL（database langfuse，账号密码 Secret pg-langfuse）
postgresql:
  deploy: false
  host: pg-rw
  port: 5432
  auth:
    username: langfuse
    existingSecret: pg-langfuse
    secretKeys: { userPasswordKey: password }
    database: langfuse

# 自带的单节点 ClickHouse（本组件 clickhouse/ Chart）
clickhouse:
  deploy: false
  host: clickhouse
  auth:
    username: default
    existingSecret: langfuse-clickhouse
    existingSecretKey: password
  migration:
    url: clickhouse://clickhouse:9000
  cluster:
    enabled: false

redis:
  deploy: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

s3:
  deploy: true
  allInOne:
    data: { size: 5Gi }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
