apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
data:
  # 小内存环境：限制服务器内存与后台线程
  low-memory.xml: |
    <clickhouse>
      <max_server_memory_usage_to_ram_ratio>0.75</max_server_memory_usage_to_ram_ratio>
      <mark_cache_size>268435456</mark_cache_size>
      <logger><level>warning</level><console>1</console></logger>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels: { app.kubernetes.io/name: clickhouse, app.kubernetes.io/part-of: contexture }
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clickhouse }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clickhouse, app.kubernetes.io/part-of: contexture }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: clickhouse
          image: {{ .Values.image }}
          env:
            - { name: CLICKHOUSE_USER, value: default }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secret }}, key: password } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          ports:
            - { name: http, containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/low-memory.xml, subPath: low-memory.xml }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: clickhouse-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector: { app.kubernetes.io/name: clickhouse }
  ports:
    - { name: http, port: 8123, targetPort: http }
    - { name: native, port: 9000, targetPort: native }
