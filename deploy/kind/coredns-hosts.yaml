# 把负责人本机的 Keycloak 域名解析到宿主机。
# kind 节点内 host.docker.internal 指向宿主机（Docker Desktop），由 tools/up.sh 解析成 IP 后替换 HOST_GATEWAY_IP。
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        hosts {
           HOST_GATEWAY_IP sso.127.0.0.1.nip.io
           fallthrough
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
