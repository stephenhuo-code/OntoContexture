{{- if .Values.route.enabled }}
# 入口路由：/bff/* → bff（Envoy Gateway，T054）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-bff
  labels: {{- include "bff.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /bff/ }
      backendRefs:
        - name: {{ .Release.Name }}-bff
          port: 8080
{{- end }}
