apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bff
  labels: {{- include "bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "bff.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bff.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env: {{- include "bff.env" . | nindent 12 }}
          volumeMounts: {{- include "bff.volumeMounts" . | nindent 12 }}
          securityContext: {{- include "bff.securityContext" . | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes: {{- include "bff.volumes" . | nindent 8 }}
