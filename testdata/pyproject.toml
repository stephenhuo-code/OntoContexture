[project]
name = "contexture-testdata"
version = "0.1.0"
description = "织境模拟工厂数据集与模拟源系统（003）：生成程序 mockfactory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "faker>=40.43.0",
    "jsonschema>=4.23",
    "pymysql>=1.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mockfactory"]
