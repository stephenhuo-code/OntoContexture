# 模拟 MES：单实例 MySQL，root 密码来自 Secret mock-mes（testdata/deploy/secrets.sh 生成）
apiVersion: v1
kind: Service
metadata:
  name: mock-mes
spec:
  selector: { app: mock-mes }
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mock-mes
spec:
  serviceName: mock-mes
  replicas: 1
  selector:
    matchLabels: { app: mock-mes }
  template:
    metadata:
      labels: { app: mock-mes }
    spec:
      containers:
        - name: mysql
          image: {{ .Values.image }}
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
            - --innodb-buffer-pool-size=256M
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mock-mes, key: root-password } }
          ports:
            - { name: mysql, containerPort: 3306 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: {{ .Values.memory }} }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: {{ .Values.storage }} }
